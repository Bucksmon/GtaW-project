<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Settings</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;

      --radius: 16px;
      --radius-sm: 12px;
      --transition: .25s ease;
    }

    /* ================= BASE ================= */

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 250px;
      padding: 60px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= TOPBAR ================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* ================= CARD ================= */

    .card {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
    }

    /* ================= FORM ================= */

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: .85rem;
      color: var(--muted);
    }

    input,
    select {
      padding: 12px;
      background: var(--box);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius-sm);
      color: var(--text);
      transition: var(--transition);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      margin-top: 10px;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      cursor: pointer;
      transition: var(--transition);
    }

    button:hover {
      opacity: 0.9;
    }

    .readonly {
      opacity: 0.7;
      pointer-events: none;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>
  <aside id="sidebar" class="sidebar">
    <h2>Royal Road</h2>
    <ul class="nav-links"></ul>
  </aside>

  <div class="overlay"></div>
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Settings</h2>
    </div>
    <div class="card">
      <h2>Settings</h2>

      <form id="settingsForm">

        <!-- SITE TAX -->
        <div id="taxWrapper"></div>

        <!-- Nickname -->
        <label>Nickname</label>
        <input id="nickname" />

        <!-- Address -->
        <label>Address</label>
        <input id="address" />

        <!-- Discord -->
        <label>Discord Tag</label>
        <input id="discord" placeholder="angel_nunez4" />

        <!-- Mobile -->
        <label>Mobile Number</label>
        <input id="mobile" placeholder="+92..." />

        <button type="submit">Save Settings</button>

      </form>
    </div>
  </main>

  <script type="module">
    import { renderSidebar } from "./methods/sidebar.js";
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "/GtaW-project/index.html";
    }

    const nicknameInput = document.getElementById("nickname");
    const addressInput = document.getElementById("address");
    const taxWrapper = document.getElementById("taxWrapper");

    let userRole = null;

    /* ================= LOAD USER ================= */

    async function loadUser() {
      try {
        const res = await fetch(`${API_BASE}/users/me`, {
          headers: { Authorization: "Bearer " + token }
        });

        const user = await res.json();

        userRole = user.role;

        // Nickname
        nicknameInput.value = user.nickname || "";

        // ROLE BASED TAX UI
        renderTax(user);

      } catch (err) {
        console.log("User load failed");
      }
    }

    /* ================= LOAD ADDRESS ================= */

    async function loadAddress() {
      try {
        const res = await fetch(`${API_BASE}/user/address`, {
          headers: { Authorization: "Bearer " + token }
        });

        if (!res.ok) throw new Error();

        const data = await res.json();

        addressInput.value = data.address || "Import Store, Little Seoul";

      } catch {
        addressInput.value = "Import Store, Little Seoul";
      }
    }

    /* ================= TAX UI ================= */

    function renderTax(user) {

      if (userRole === "superadmin") {
        taxWrapper.innerHTML = `
          <label>Site Tax for sellers</label>
          <select id="taxSelect">
            <option>10</option>
            <option>15</option>
            <option>20</option>
            <option>25</option>
            <option>30</option>
          </select>
        `;
      } else {
        taxWrapper.innerHTML = `
          <label>Site Balance</label>
          <input class="readonly" value="${user.siteBalance ?? 0}" />
        `;
      }
    }

    /* ================= SUBMIT ================= */

    document.getElementById("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        nickname: nicknameInput.value,
        address: addressInput.value,
        discord: document.getElementById("discord").value,
        mobile: document.getElementById("mobile").value
      };

      if (userRole === "superadmin") {
        payload.tax = document.getElementById("taxSelect").value;
      }

      try {
        const res = await fetch(`${API_BASE}/users/settings`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error();

        alert("Settings updated");

      } catch {
        alert("Failed to update");
      }
    });

    /* ================= INIT ================= */
    const sidebar = document.getElementById("sidebar");
    const overlay = document.querySelector(".overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });
    
    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar(); // 👈 ADD THIS
      loadUser();
      loadAddress();
    });
  </script>

</body>

</html>
