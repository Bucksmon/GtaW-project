<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Settings</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #121a2a;
      --box: #1a2440;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;

      --radius: 14px;
      --radius-sm: 10px;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
    }

    .main {
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 500px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    input, select {
      padding: 12px;
      background: var(--box);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius-sm);
      color: var(--text);
    }

    button {
      margin-top: 10px;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      cursor: pointer;
    }

    .readonly {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <main class="main">
    <div class="card">
      <h2>Settings</h2>

      <form id="settingsForm">

        <!-- SITE TAX -->
        <div id="taxWrapper"></div>

        <!-- Nickname -->
        <label>Nickname</label>
        <input id="nickname" />

        <!-- Address -->
        <label>Address</label>
        <input id="address" />

        <!-- Discord -->
        <label>Discord Tag</label>
        <input id="discord" placeholder="angel_nunez4" />

        <!-- Mobile -->
        <label>Mobile Number</label>
        <input id="mobile" placeholder="+92..." />

        <button type="submit">Save Settings</button>

      </form>
    </div>
  </main>

  <script>
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "../index.html";
    }

    const nicknameInput = document.getElementById("nickname");
    const addressInput = document.getElementById("address");
    const taxWrapper = document.getElementById("taxWrapper");

    let userRole = user;

    /* ================= LOAD USER ================= */

    async function loadUser() {
      try {
        const res = await fetch(`${API_BASE}/users/me`, {
          headers: { Authorization: "Bearer " + token }
        });

        const user = await res.json();

        userRole = user.role;

        // Nickname
        nicknameInput.value = user.nickname || "";

        // ROLE BASED TAX UI
        renderTax(user);

      } catch (err) {
        console.log("User load failed");
      }
    }

    /* ================= LOAD ADDRESS ================= */

    async function loadAddress() {
      try {
        const res = await fetch(`${API_BASE}/user/address`, {
          headers: { Authorization: "Bearer " + token }
        });

        if (!res.ok) throw new Error();

        const data = await res.json();

        addressInput.value = data.address || "Import Store, Little Seoul";

      } catch {
        addressInput.value = "Import Store, Little Seoul";
      }
    }

    /* ================= TAX UI ================= */

    function renderTax(user) {

      if (userRole === "superadmin") {
        taxWrapper.innerHTML = `
          <label>Site Tax for sellers</label>
          <select id="taxSelect">
            <option>10</option>
            <option>15</option>
            <option>20</option>
            <option>25</option>
            <option>30</option>
          </select>
        `;
      } else {
        taxWrapper.innerHTML = `
          <label>Site Balance</label>
          <input class="readonly" value="${user.siteBalance ?? 0}" />
        `;
      }
    }

    /* ================= SUBMIT ================= */

    document.getElementById("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        nickname: nicknameInput.value,
        address: addressInput.value,
        discord: document.getElementById("discord").value,
        mobile: document.getElementById("mobile").value
      };

      if (userRole === "superadmin") {
        payload.tax = document.getElementById("taxSelect").value;
      }

      try {
        const res = await fetch(`${API_BASE}/users/settings`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error();

        alert("Settings updated");

      } catch {
        alert("Failed to update");
      }
    });

    /* ================= INIT ================= */

    document.addEventListener("DOMContentLoaded", () => {
      loadUser();
      loadAddress();
    });
  </script>

</body>
</html>>
