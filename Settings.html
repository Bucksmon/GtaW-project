<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Settings</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;

      --radius: 16px;
      --radius-sm: 10px;
      --transition: .25s ease;
    }

    /* ================= BASE ================= */

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 250px;
      padding: 50px 60px;
      min-height: 100vh;
    }

    /* ================= TOPBAR ================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* ================= PAGE LAYOUT ================= */

    .settings-container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* ================= SECTION ================= */

    .settings-section {
      margin-bottom: 40px;
    }

    .settings-section h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    /* ================= ROW ================= */

    .settings-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .settings-row label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ================= INPUT ================= */

    input,
    select {
      padding: 12px;
      background: var(--box);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius-sm);
      color: var(--text);
      transition: var(--transition);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ================= BUTTON ================= */

    button {
      margin-top: 20px;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      cursor: pointer;
      width: 200px;
    }

    button:hover {
      opacity: 0.9;
    }

    /* ================= STATES ================= */

    .readonly {
      opacity: 0.6;
      pointer-events: none;
    }

    .error {
      color: #ff4f4f;
      font-size: 0.75rem;
      min-height: 14px;
    }

    input.invalid {
      border-color: #ff4f4f;
    }

    .form-message {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .form-message.success {
      color: #2ecc71;
    }

    .form-message.error {
      color: #ff4f4f;
    }

    /* ================= LOADER ================= */

    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .loader-overlay.show {
      display: flex;
    }

    .popup {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, .2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }

      .settings-container {
        max-width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>

</head>

<body>
  <aside id="sidebar" class="sidebar">
    <h2>Royal Road</h2>
    <ul class="nav-links"></ul>
  </aside>

  <div class="overlay"></div>
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Settings</h2>
    </div>
    <div class="card">
      <h2>Settings</h2>

      <form id="settingsForm">

        <!-- SITE TAX -->
        <div id="taxWrapper"></div>

        <label>Nickname</label>
        <input id="nickname" />
        <small class="error" id="nicknameError"></small>

        <label>Discord Tag</label>
        <input id="discord" placeholder="angel_nunez4" />
        <small class="error" id="discordError"></small>

        <label>Mobile Number</label>
        <input id="mobile" />
        <small class="error" id="mobileError"></small>

        <small id="formMessage" class="form-message"></small>

        <button type="submit">Save Settings</button>

      </form>
    </div>
  </main>

  <div id="loaderOverlay" class="loader-overlay">
    <div class="popup">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <script type="module">
    import { renderSidebar } from "./methods/sidebar.js";

    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");
    let userRole = null;

    if (!token) {
      window.location.href = "/GtaW-project/index.html";
    }

    // ================= DOM =================
    const loaderOverlay = document.getElementById("loaderOverlay");
    const taxWrapper = document.getElementById("taxWrapper");
    const form = document.getElementById("settingsForm");
    const formMessage = document.getElementById("formMessage");

    // ================= LOADER =================
    function showLoader() {
      loaderOverlay.classList.add("show");
    }

    function hideLoader() {
      loaderOverlay.classList.remove("show");
    }

    // ================= FIELD CONFIG =================
    const fields = {
      nickname: {
        el: document.getElementById("nickname"),
        validate: (val) => val && val.length < 2 ? "At least 2 characters" : ""
      },
      discord: {
        el: document.getElementById("discord"),
        validate: (val) => {
          const regex = /^[a-zA-Z0-9._]{2,32}$/;
          return val && !regex.test(val) ? "Invalid username" : "";
        }
      },
      mobile: {
        el: document.getElementById("mobile"),
        validate: (val) => {
          const regex = /^\+?[0-9]{10,15}$/;
          return val && !regex.test(val) ? "Invalid number" : "";
        }
      }
    };

    // ================= ERROR HANDLING =================
    function setError(input, message) {
      const errorEl = document.getElementById(input.id + "Error");
      input.classList.add("invalid");
      errorEl.textContent = message;
    }

    function clearError(input) {
      const errorEl = document.getElementById(input.id + "Error");
      input.classList.remove("invalid");
      errorEl.textContent = "";
    }

    function showMessage(msg, type = "error") {
      formMessage.textContent = msg;
      formMessage.className = `form-message ${type}`;
    }

    function clearMessage() {
      formMessage.textContent = "";
      formMessage.className = "form-message";
    }

    // ================= VALIDATION =================
    function validateField(key) {
      const field = fields[key];
      const value = field.el.value.trim();

      const error = field.validate(value);

      if (error) {
        setError(field.el, error);
        return false;
      }

      clearError(field.el);
      return true;
    }

    function validateAll() {
      let isValid = true;

      Object.keys(fields).forEach(key => {
        if (!validateField(key)) isValid = false;
      });

      return isValid;
    }

    // ================= REAL-TIME =================
    Object.keys(fields).forEach(key => {
      fields[key].el.addEventListener("input", () => {
        validateField(key);
      });
    });

    // ================= LOAD USER =================
    function populateForm(user = {}) {
      const mapping = {
        nickname: user.nickName,
        discord: user.discordTag,
        mobile: user.mobileNumber
      };

      Object.entries(mapping).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) el.value = value ?? "";
      });
    }

    async function loadUser() {
      showLoader();

      try {
        const res = await fetch(`${API_BASE}/users/me`, {
          headers: { Authorization: "Bearer " + token }
        });

        const user = await res.json();
        userRole = user.role;

        populateForm(user);
        renderTax(user);

      } catch (err) {
        console.log("User load failed");
      } finally {
        hideLoader();
      }
    }

    // ================= TAX =================
    function renderTax(user) {
      if (user.role === "superadmin") {
        taxWrapper.innerHTML = `
      <label>Site Tax for sellers</label>
      <select id="taxSelect">
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
        <option value="30">30</option>
      </select>
    `;

        const select = document.getElementById("taxSelect");

        if (select) {
          select.value = user.commissionRate ?? "10";

          select.addEventListener("change", async () => {
            showLoader();

            try {
              const res = await fetch(`${API_BASE}/users/Commission-Rate`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + token
                },
                body: JSON.stringify({
                  commissionRate: Number(select.value)
                })
              });

              if (!res.ok) throw new Error();

            } catch {
              showMessage("Failed to update tax", "error");
            } finally {
              hideLoader();
            }
          });
        }

      } else {
        taxWrapper.innerHTML = `
      <label>Site Tax</label>
      <input class="readonly" value="${user.commissionRate ?? 0}" />
    `;
      }
    }

    // ================= SUBMIT =================
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showLoader();
      clearMessage();

      if (!validateAll()) {
        hideLoader();
        return;
      }

      const payload = {};

      Object.keys(fields).forEach(key => {
        const value = fields[key].el.value.trim();

        if (value) {
          if (key === "nickname") payload.nickName = value;
          if (key === "discord") payload.discordTag = value;
          if (key === "mobile") payload.mobileNumber = value;
        }
      });

      if (userRole === "superadmin") {
        payload.commissionRate = Number(document.getElementById("taxSelect").value);
      }

      if (Object.keys(payload).length === 0) {
        showMessage("No changes made", "error");
        hideLoader();
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/users/Settings`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        showMessage("Settings updated successfully", "success");

      } catch (err) {
        showMessage(err.message || "Failed to update", "error");
      } finally {
        hideLoader();
      }
    });

    // ================= INIT =================
    const sidebar = document.getElementById("sidebar");
    const overlay = document.querySelector(".overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      loadUser();
    });
  </script>

</body>

</html>
