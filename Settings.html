<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Settings</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;

      --radius: 16px;
      --radius-sm: 12px;
      --transition: .25s ease;
    }

    /* ================= BASE ================= */

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 250px;
      padding: 60px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= TOPBAR ================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* ================= CARD ================= */

    .card {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
    }

    /* ================= FORM ================= */

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: .85rem;
      color: var(--muted);
    }

    input,
    select {
      padding: 12px;
      background: var(--box);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius-sm);
      color: var(--text);
      transition: var(--transition);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      margin-top: 10px;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      cursor: pointer;
      transition: var(--transition);
    }

    button:hover {
      opacity: 0.9;
    }

    .readonly {
      opacity: 0.7;
      pointer-events: none;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .loader-overlay.show {
      display: flex;
    }

    .popup {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, .2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <aside id="sidebar" class="sidebar">
    <h2>Royal Road</h2>
    <ul class="nav-links"></ul>
  </aside>

  <div class="overlay"></div>
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Settings</h2>
    </div>
    <div class="card">
      <h2>Settings</h2>

      <form id="settingsForm">

        <!-- SITE TAX -->
        <div id="taxWrapper"></div>

        <!-- Nickname -->
        <label>Nickname</label>
        <input id="nickname" />

        <!-- Discord -->
        <label>Discord Tag</label>
        <input id="discord" placeholder="angel_nunez4" />

        <!-- Mobile -->
        <label>Mobile Number</label>
        <input id="mobile" placeholder="+92..." />

        <button type="submit">Save Settings</button>

      </form>
    </div>
  </main>

  <div id="loaderOverlay" class="loader-overlay">
    <div class="popup">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <script type="module">
    import { renderSidebar } from "./methods/sidebar.js";

    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "/GtaW-project/index.html";
    }

    const nicknameInput = document.getElementById("nickname");
    const taxWrapper = document.getElementById("taxWrapper");

    const loaderOverlay = document.getElementById("loaderOverlay");

    function showLoader() {
      loaderOverlay.classList.add("show");
    }

    function hideLoader() {
      loaderOverlay.classList.remove("show");
    }
    /* ================= FORM MAPPER ================= */

    function populateForm(user = {}) {
      const mapping = {
        nickname: user.nickName,
        discord: user.discordTag,
        mobile: user.mobileNumber
      };

      Object.entries(mapping).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) {
          el.value = value ?? "";
        }
      });
    }

    /* ================= LOAD USER ================= */
    async function loadUser() {
      showLoader();

      try {
        const res = await fetch(`${API_BASE}/users/me`, {
          headers: { Authorization: "Bearer " + token }
        });

        const user = await res.json();
        userRole = user.role;
        populateForm(user);
        renderTax(user); // ✅ now works

      } catch (err) {
        console.log("User load failed");
      } finally {
        hideLoader();
      }
    }


    /* ================= TAX UI ================= */
    function renderTax(user) {
      if (user.role === "superadmin") {
        taxWrapper.innerHTML = `
      <label>Site Tax for sellers</label>
      <select id="taxSelect">
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
        <option value="30">30</option>
      </select>
    `;

        const select = document.getElementById("taxSelect");

        if (select) {
          select.value = user.commissionRate ?? "10";

          select.addEventListener("change", async () => {
            showLoader();

            try {
              await fetch(`${API_BASE}/users/Commission-Rate`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + token
                },
                body: JSON.stringify({
                  commissionRate: Number(select.value)
                })
              });

            } catch (err) {
              console.log("Failed to update commission");
            } finally {
              hideLoader();
            }
          });
        }

      } else {
        taxWrapper.innerHTML = `
      <label>Site Tax</label>
      <input class="readonly" value="${user.commissionRate ?? 0}" />
    `;
      }
    }

    /* ================= SUBMIT ================= */

    document.getElementById("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      showLoader(); // ✅ start

      const payload = {};

      const nickname = document.getElementById("nickname").value.trim();
      const discord = document.getElementById("discord").value.trim();
      const mobile = document.getElementById("mobile").value.trim();

      if (nickname) payload.nickName = nickname;
      if (discord) payload.discordTag = discord;
      if (mobile) payload.mobileNumber = mobile;

      if (userRole === "superadmin") {
        payload.commissionRate = Number(document.getElementById("taxSelect").value);
      }

      try {
        const res = await fetch(`${API_BASE}/users/Settings`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error();

        alert("Settings updated");

      } catch {
        alert("Failed to update");
      } finally {
        hideLoader(); // ✅ always stop
      }
    });

    /* ================= INIT ================= */

    const sidebar = document.getElementById("sidebar");
    const overlay = document.querySelector(".overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      loadUser();
    });
  </script>

</body>

</html>
