<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<title>Buyer Panel</title>

<style>
:root {
  --bg:#0b0f1a;
  --panel:#111827;
  --card:#121a2a;
  --box:#1a2440;
  --text:#e6e9f2;
  --muted:#9aa4b8;
  --accent:#4f8cff;
  --danger:#ff4f4f;
}

* {
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body {
  margin:0;
  background: radial-gradient(circle at top,#111827,#0b0f1a 60%,#070a10);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar {
  position:fixed;
  top:0;
  left:0;
  width:240px;
  height:100%;
  background:var(--panel);
  border-right:1px solid rgba(255,255,255,0.08);
  padding-top:25px;
  transition:transform .3s ease;
  z-index:1000;
  box-shadow:4px 0 20px rgba(0,0,0,0.5);
}

.sidebar h2 {
  text-align:center;
  margin-bottom:25px;
}

.nav-links {
  list-style:none;
  padding:0;
}

.nav-links li {
  margin:6px 15px;
}

.nav-links a {
  display:block;
  padding:12px 16px;
  color:white;
  text-decoration:none;
  border-radius:10px;
  transition:.2s;
}

.nav-links a:hover,
.nav-links a.active {
  background:rgba(96,96,96,0.4);
}

/* Overlay */
.overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:900;
}

.overlay.active {
  display:block;
}

/* ================= MAIN ================= */

.main {
  margin-left:240px;
  padding:20px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* Topbar */
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.menu-btn {
  font-size:1.6rem;
  background:none;
  border:none;
  color:var(--text);
  cursor:pointer;
  display:none;
}

/* ================= SERVICES ================= */

.services {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
  margin-top:20px;
}

.service-card {
  background:var(--card);
  border-radius:14px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:.2s;
}

.service-card:hover {
  transform:translateY(-4px);
}

.service-image {
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
  background:var(--box);
}

.service-card button {
  margin-top:auto;
  padding:8px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  transition:.2s;
}

.service-card button:hover {
  opacity:.85;
}

#pagination {
  margin-top:20px;
}

#pagination button {
  margin:4px;
  padding:6px 10px;
}

/* ================= RESPONSIVE ================= */

@media (max-width:768px){

  .sidebar {
    transform:translateX(-100%);
  }

  .sidebar.open {
    transform:translateX(0);
  }

  .main {
    margin-left:0;
  }

  .menu-btn {
    display:block;
  }

  .services {
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">
  <h2>Buyer Panel</h2>
  <ul class="nav-links">
    <li><a href="buyer.html">Browse Services</a></li>
    <li><a href="buyerOrder.html">Orders</a></li>
    <li><a href="addCredits.html">Add Credits</a></li>
    <li><a href="../index.html">Logout</a></li>
  </ul>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">

  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
  </div>

  <div id="servicesContainer" class="services"></div>
  <div id="pagination"></div>

</main>

<script>
const API_BASE="https://gtaw-project.vercel.app";
const token=localStorage.getItem("token");

if(!token){
  window.location.href="../index.html";
}

/* ===== Sidebar Toggle ===== */
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
const menuBtn=document.getElementById("menuBtn");

menuBtn.addEventListener("click",()=>{
  sidebar.classList.toggle("open");
  overlay.classList.toggle("active");
});

overlay.addEventListener("click",()=>{
  sidebar.classList.remove("open");
  overlay.classList.remove("active");
});

/* Active nav highlight */
const currentPagePath=window.location.pathname.split("/").pop();
document.querySelectorAll(".nav-links a").forEach(link=>{
  if(link.getAttribute("href")===currentPagePath){
    link.classList.add("active");
  }
});

let currentPage=1;

async function loadServices(page=1){
  try{
    const res=await fetch(`${API_BASE}/services?page=${page}&limit=8`,{
      cache:"no-store"
    });

    const data=await res.json();
    if(!res.ok) return;

    renderServices(data.services || []);
    renderPagination(data.page || 1,data.totalPages || 1);

  }catch(err){
    console.error(err);
  }
}

function renderServices(services){
  const container=document.getElementById("servicesContainer");
  container.innerHTML="";

  if(!services.length){
    container.innerHTML="<p>No services found.</p>";
    return;
  }

  services.forEach(service=>{
    const card=document.createElement("div");
    card.className="service-card";

    card.innerHTML=`
      <img class="service-image" 
           src="${service.service_image || 'https://i.imgur.com/placeholder.png'}" 
           alt="Service Image">
      <h3>${service.service_title || "No title"}</h3>
      <p>${service.service_description || "No description"}</p>
      <p><strong>Price:</strong> ${service.service_price || 0} credits</p>
      <p><strong>Seller:</strong> ${service.service_sellerId?.username || "Unknown"}</p>
      <button onclick="buyService('${service._id}')">Buy</button>
    `;

    container.appendChild(card);
  });
}

function renderPagination(current,total){
  const pagination=document.getElementById("pagination");
  pagination.innerHTML="";

  for(let i=1;i<=total;i++){
    const btn=document.createElement("button");
    btn.textContent=i;
    if(i===current) btn.disabled=true;
    btn.onclick=()=>{
      currentPage=i;
      loadServices(i);
    };
    pagination.appendChild(btn);
  }
}

async function buyService(serviceId){
  try{
    const res=await fetch(`${API_BASE}/orders/buy-service`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:`Bearer ${token}`
      },
      body:JSON.stringify({serviceId})
    });

    const data=await res.json();
    if(!res.ok) return alert(data.error || "Purchase failed");

    alert("Service purchased!");
    document.getElementById("creditsDisplay").textContent=data.buyerCredits;

  }catch(err){
    console.error(err);
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  loadServices(currentPage);
});
</script>

</body>
</html>
