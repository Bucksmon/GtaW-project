<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Buyer Panel</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #121a2a;
      --box: #1a2440;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --danger: #ff4f4f;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 6px 10px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    .nav-links a:hover {
      background: rgba(96, 96, 96, 0.432);
    }

    .main {
      margin-left: 240px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .service-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .service-card button {
      margin-top: auto;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    .service-card button:hover {
      opacity: 0.85;
    }

    #pagination button {
      margin: 4px;
      padding: 6px 10px;
    }

    /* Debug panel */
    .debug-panel {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 420px;
      max-height: 250px;
      overflow-y: auto;
      background: #000;
      color: #00ff88;
      font-size: 12px;
      padding: 10px;
      border-top-left-radius: 10px;
      z-index: 9999;
    }

    .error-log {
      color: var(--danger);
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <h2>Buyer Panel</h2>
    <ul class="nav-links">
      <li><a href="buyer.html">Browse Services</a></li>
      <li><a href="buyerOrder.html">Orders</a></li>
      <li><a href="addCredits.html">Add Credits</a></li>
      <li><a href="../index.html">Logout</a></li>
    </ul>
  </aside>

  <main class="main">
    <h2>Your Credits: <span id="creditsDisplay">0</span></h2>

    <div id="servicesContainer" class="services"></div>
    <div id="pagination"></div>
  </main>

  <div class="debug-panel" id="debugPanel"></div>

  <script>
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");
    const debugPanel = document.getElementById("debugPanel");

    function log(message, data = null, isError = false) {
      console.log(message, data || "");
      const entry = document.createElement("div");
      entry.className = isError ? "error-log" : "";
      entry.textContent = data
        ? `${message} ${JSON.stringify(data)}`
        : message;
      debugPanel.appendChild(entry);
    }

    if (!token) {
      log("No token found. Redirecting...", null, true);
      window.location.href = "../index.html";
    } else {
      log("Token found.");
    }

    let currentPage = 1;

    async function loadServices(page = 1) {
      log("Loading services for page:", page);

      try {
        const url = `${API_BASE}/services?page=${page}&limit=8`;
        log("Fetching:", url);

        const res = await fetch(url, {
          cache: "no-store"
        });

        log("Response status:", res.status);

        const text = await res.text();
        log("Raw response:", text);

        if (!res.ok) {
          log("Response not OK", null, true);
          return;
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          log("JSON parse error", e.message, true);
          return;
        }

        log("Parsed data:", data);

        if (!data.services || !Array.isArray(data.services)) {
          log("Invalid services format", null, true);
          return;
        }

        renderServices(data.services);
        renderPagination(data.page || 1, data.totalPages || 1);

      } catch (err) {
        log("Fetch error:", err.message, true);
      }
    }

    function renderServices(services) {
      log("Rendering services:", services.length);

      const container = document.getElementById("servicesContainer");
      container.innerHTML = "";

      if (services.length === 0) {
        container.innerHTML = "<p>No services found.</p>";
        return;
      }

      services.forEach(service => {
        const card = document.createElement("div");
        card.className = "service-card";

        card.innerHTML = `
          <h3>${service.service_title || "No title"}</h3>
          <p>${service.service_description || "No description"}</p>
          <p><strong>Price:</strong> ${service.service_price || 0} credits</p>
          <p><strong>Seller:</strong> ${service.service_sellerId?.username || "Unknown"}</p>
          <button onclick="buyService('${service._id}')">Buy</button>
        `;

        container.appendChild(card);
      });
    }

    function renderPagination(current, total) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";

      for (let i = 1; i <= total; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        if (i === current) btn.disabled = true;
        btn.onclick = () => {
          currentPage = i;
          loadServices(i);
        };
        pagination.appendChild(btn);
      }
    }

    async function buyService(serviceId) {
      log("Buying service:", serviceId);

      try {
        const res = await fetch(`${API_BASE}/orders/buy-service`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ serviceId })
        });

        const data = await res.json();
        log("Purchase response:", data);

        if (!res.ok) {
          alert(data.error || "Purchase failed");
          return;
        }

        alert("Service purchased!");
        updateCreditsUI(data.buyerCredits);

      } catch (err) {
        log("Purchase error:", err.message, true);
      }
    }

    function updateCreditsUI(credits) {
      document.getElementById("creditsDisplay").textContent = credits;
      log("Credits updated:", credits);
    }

    document.addEventListener("DOMContentLoaded", () => {
      log("DOM fully loaded.");
      loadServices(currentPage);
    });
  </script>

</body>

</html>
