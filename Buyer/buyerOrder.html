<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Buyer Orders</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #151e33;
            --box: #1e2945;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --danger: #ff4f4f;

            --radius: 16px;
            --radius-sm: 12px;
            --transition: .25s ease;
        }

        /* ================= BASE ================= */

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, .06);
            padding: 30px 0;
            transition: transform var(--transition);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 8px 18px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, .08);
        }

        /* ================= OVERLAY ================= */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 250px;
            padding: 60px 40px;
            min-height: 100vh;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text);
            cursor: pointer;
        }

        /* ================= TABS ================= */

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 18px;
            min-width: 140px;
            background: var(--box);
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text);
            cursor: pointer;
            text-align: center;
        }

        .tab.active {
            background: var(--accent);
        }

        /* ================= FORM ================= */

        .add-wrapper {
            display: flex;
            justify-content: center;
        }

        .form-card {
            background: var(--card);
            padding: 32px;
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 22px;
        }

        .form-group input,
        .form-group textarea {
            padding: 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, .08);
            background: var(--box);
            color: var(--text);
        }

        textarea {
            min-height: 60px;
            resize: vertical;
        }

        .submit-btn {
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: block;
            margin-left: auto;
            margin-right: auto;
            min-width: 180px;
        }

        /* ================= GRID (FIXED) ================= */

        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            /* ✅ ALWAYS 2 cards */
            max-width: 900px;
            margin: 0 auto;
            gap: 30px;
        }

        /* ================= CARD ================= */

        .service-card {
            background: var(--card);
            padding: 20px;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 340px;
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-6px);
        }

        /* ================= IMAGE ================= */

        .service-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        /* ================= TEXT ================= */

        .service-card h3 {
            margin: 0;
            font-size: 1.05rem;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .service-card p {
            margin: 0;
            font-size: .9rem;
            color: var(--muted);

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ================= META ================= */

        .service-meta {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, .06);
            padding-top: 8px;
        }

        .service-meta span {
            font-size: 0.85rem;
        }

        /* ================= BUTTON ================= */

        .danger-btn {
            margin-top: auto;
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        /* ================= PAGINATION ================= */

        #pagination {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #pagination button {
            padding: 8px 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--box);
            color: var(--text);
            cursor: pointer;
        }

        #pagination button:disabled {
            opacity: .5;
        }

        /* ================= LOADER ================= */

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .loader-overlay.show {
            display: flex;
        }

        .popup {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, .2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {
            .services {
                grid-template-columns: 1fr;
                /* ✅ 1 card */
            }
        }

        @media (max-width:850px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 30px 20px;
            }

            .menu-btn {
                display: block;
            }
        }
    </style>

</head>

<body>

    <aside class="sidebar" id="sidebar">
        <h2>Royal Road</h2>
        <ul class="nav-links" id="navLinks"></ul>
    </aside>

    <div class="overlay" id="overlay"></div>
    <!-- GLOBAL LOADER -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="popup">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="buy">Buy Orders</button>
            <button class="tab" data-tab="sell">Sell Orders</button>
        </div>
        <div id="servicesContainer" class="services"></div>
        <div id="pagination"></div>
    </main>

    <script type="module">

        import { renderSidebar } from "../methods/sidebar.js";
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "../index.html";

        const loaderOverlay = document.getElementById("loaderOverlay");


        let currentPage = 1;
        const limit = 6;

        let activeTab = "buy";
        let allOrders = [];

        /* ================= JWT ================= */

        function parseJWT(token) {
            try {
                return JSON.parse(atob(token.split(".")[1]));
            } catch {
                return null;
            }
        }

        const userData = parseJWT(token);
        const userId = userData?.id;

        /* ================= LOADER ================= */

        function showLoader() {
            loaderOverlay.classList.add("show");
        }

        function hideLoader() {
            loaderOverlay.classList.remove("show");
        }

        /* ================= TABS ================= */

        const tabs = document.querySelectorAll(".tab");

        tabs.forEach(tab => {

            tab.addEventListener("click", async () => {

                tabs.forEach(t => t.classList.remove("active"));
                tab.classList.add("active");

                activeTab = tab.dataset.tab;

                showLoader(); // ✅ loader on tab switch

                try {
                    await loadBuyerOrders(currentPage, true);
                } catch (err) {
                    console.log("Tab switch load failed");
                } finally {
                    hideLoader();
                }

            });

        });

        /* ================= LOAD ORDERS ================= */

        async function loadBuyerOrders(page = 1, show = true) {

            if (show) showLoader();

            try {
                const res = await fetch(
                    `${API_BASE}/orders/mine?page=${page}&limit=${limit}`,
                    {
                        headers: { Authorization: `Bearer ${token}` }
                    }
                );

                if (!res.ok) throw new Error();

                const data = await res.json();

                allOrders = data.orders || [];

                filterOrders();
                renderPagination(data.pagination);

            } catch (err) {
                console.log("Failed to load orders", err);
            } finally {
                if (show) hideLoader();
            }
        }

        /* ================= FILTER ORDERS ================= */

        function filterOrders() {

            let filtered = [];

            if (activeTab === "buy") {
                filtered = allOrders.filter(
                    order => order.buyer?._id === userId
                );
            }

            if (activeTab === "sell") {
                filtered = allOrders.filter(
                    order => order.seller?._id === userId
                );
            }

            renderOrders(filtered);

        }

        /* ================= RENDER ORDERS ================= */

        function renderOrders(orders) {

            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            if (!orders.length) {
                container.innerHTML = "<p>No orders in this category.</p>";
                return;
            }

            orders.forEach(order => {

                const card = document.createElement("div");
                card.className = "service-card";
                card.innerHTML = `
        <img class="service-image"
        src="${order.service?.service_image || 'https://i.imgur.com/placeholder.png'}">

        <h3>${order.service?.service_title}</h3>

        <div class="order-row">
            <span>
        <strong>${activeTab === "buy" ? "Seller" : "Buyer"}:</strong>
        ${activeTab === "buy"
                        ? (order.seller?.nickName || "Anonymous")
                        : (order.buyer?.nickName || "Anonymous")}
    </span>

            <span><strong>Total:</strong> <span style="color: #2ecc71;">${order.totalPrice}</span></span>
        </div>

        <div class="order-row">
            <span>
                <strong>${activeTab === "buy" ? "You Paid" : "You Received"}:</strong>
                <span style="color:#2ecc71;"> ${order.sellerAmount}</span>
            </span>
            ${activeTab === "sell"
                        ? order.status?.toLowerCase() === "pending"
                            ? `
      <select class="status-dropdown" data-id="${order._id}">
       <option value="pending" ${order.status === "pending" ? "selected" : ""}>Pending</option>
        <option value="completed" ${order.status === "completed" ? "selected" : ""}>Completed</option>
        <option value="cancelled" ${order.status === "cancelled" ? "selected" : ""}>Cancelled</option>
      </select>
    `
                            : `
      <span class="order-status ${order.status?.toLowerCase()}">
        ${order.status}
      </span>
    `
                        : `
      <span class="order-status ${order.status?.toLowerCase()}">
        ${order.status}
      </span>
    `
                    } 
        </div>
        <div class="order-row">
            <span>
                <strong>
                    ${activeTab === "buy" ? "Seller Number" : "Buyer Number"}:
                </strong>
                <span>
                    ${activeTab === "buy"
                        ? (order.seller?.mobileNumber || "Not Set")
                        : (order.buyer?.mobileNumber || "Not Set")}
                </span>
            </span>
            <span>
                <strong>Discord:</strong>
                <span>
                    ${activeTab === "buy"
                        ? (order.seller?.discordTag || "Not Set")
                        : (order.buyer?.discordTag || "Not Set")}
                </span>
            </span>
        </div>

        <div class="order-row">
            <span>
                <strong>
                    Address:
                </strong>
                <span>
                    Little Seoul import store, Palomino Avenue, Little Seoul
                </span>
            </span>
        </div>
        `;

                container.appendChild(card);

            });
            document.querySelectorAll(".status-dropdown").forEach(select => {
                const orderId = select.dataset.id;

                // set initial color
                updateDropdownColor(select);

                select.addEventListener("change", async () => {
                    const newStatus = select.value;

                    updateDropdownColor(select);

                    select.disabled = true; // prevent spam clicks
                    showLoader(); // ✅ start loader

                    try {
                        const res = await fetch(`${API_BASE}/orders/${orderId}/status`, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: "Bearer " + token
                            },
                            body: JSON.stringify({ status: newStatus })
                        });

                        if (!res.ok) throw new Error();

                        // OPTIONAL: refresh orders to stay in sync
                        await loadBuyerOrders(currentPage, false);

                    } catch (err) {
                        console.log("Status update failed");

                        // optional rollback (if needed)
                    } finally {
                        select.disabled = false;
                        hideLoader(); // ✅ stop loader
                    }
                });
            });
        }
        function updateDropdownColor(select) {
            const value = select.value.toLowerCase();

            select.classList.remove("completed", "cancelled");

            if (value === "completed") {
                select.classList.add("completed");
            }

            if (value === "cancelled") {
                select.classList.add("cancelled");
            }
        }
        /* ================= PAGINATION ================= */

        function renderPagination(pagination) {

            const paginationDiv = document.getElementById("pagination");
            paginationDiv.innerHTML = "";

            if (!pagination || pagination.totalPages <= 1) return;

            for (let i = 1; i <= pagination.totalPages; i++) {

                const btn = document.createElement("button");
                btn.textContent = i;

                if (i === pagination.currentPage) {
                    btn.disabled = true;
                }

                btn.onclick = () => {
                    currentPage = i;
                    loadBuyerOrders(i);
                };

                paginationDiv.appendChild(btn);

            }

        }

        /* ================= LOAD CREDITS ================= */

        async function loadCredits(show = false) {

            if (show) showLoader();

            try {

                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();

                document.getElementById("creditsDisplay").innerHTML = `<span style="color:var(--success)">${user.credits ?? 0}</span>`;

            } catch (err) {
                console.log("Failed to load credits", err);
            } finally {
                if (show) hideLoader();
            }

        }

        /* ================= INIT ================= */

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            loadBuyerOrders(currentPage, true);
            loadCredits(true);
            setInterval(() => loadCredits(false), 15000);
        });

    </script>

</body>

</html>
