<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Buyer Orders</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --danger: #ff4f4f;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            padding-top: 25px;
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 6px 15px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(96, 96, 96, 0.4);
        }

        .main {
            margin-left: 240px;
            padding: 20px;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .service-card {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .service-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--box);
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h2>Buyer Panel</h2>
        <ul class="nav-links">
            <li><a href="buyer.html">Browse Services</a></li>
            <li><a class="active" href="buyerOrder.html">Orders</a></li>
            <li><a href="addCredits.html">Add Credits</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <main class="main">
        <h2>My Purchases</h2>
        <div id="servicesContainer" class="services"></div>
    </main>

    <script>
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "../index.html";
        }

        async function loadBuyerOrders() {
            try {
                const res = await fetch(`${API_BASE}/orders/buyer`, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                const data = await res.json();
                if (!res.ok) return alert(data.error || "Failed to load orders");

                renderOrders(data);

            } catch (err) {
                console.error(err);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            if (!orders.length) {
                container.innerHTML = "<p>No purchases yet.</p>";
                return;
            }

            orders.forEach(order => {
                const card = document.createElement("div");
                card.className = "service-card";

                card.innerHTML = `
                    <img class="service-image"
                        src="${order.service?.service_image || 'https://i.imgur.com/placeholder.png'}"
                        alt="Service Image">
                    <h3>${order.service?.service_title || "Unknown Service"}</h3>
                    <p><strong>Seller:</strong> ${order.seller?.username || "Unknown"}</p>
                    <p><strong>Paid:</strong> ${order.totalPrice} credits</p>
                    <p><strong>Status:</strong> ${order.status}</p>
                `;

                container.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", loadBuyerOrders);
    </script>

</body>

</html>
