<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Buyer Orders</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --danger: #ff4f4f;

            --radius: 14px;
            --radius-sm: 10px;
            --transition: .25s ease;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== Layout ===== */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, .06);
            padding: 25px 0;
            transition: transform var(--transition);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 6px 15px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: white;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, .08);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        .main {
            margin-left: 240px;
            padding: 30px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text);
            cursor: pointer;
        }

        /* ================= GRID ================= */

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* ================= CARD ================= */

        .service-card {
            background: var(--card);
            padding: 22px;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-6px);
        }

        .service-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--box);
        }

        .service-card h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .service-card p {
            margin: 0;
            font-size: .9rem;
            color: var(--muted);
        }

        .service-card strong {
            color: var(--text);
        }

        /* ================= ORDER STATUS COLORS ================= */

        .service-card p:last-child {
            font-weight: 600;
        }

        .service-card p:last-child:contains("completed"),
        .service-card p:last-child:contains("Completed") {
            color: var(--success);
        }

        /* ================= ORDER ROW ================= */

        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: .9rem;
            color: var(--muted);
        }

        .order-row span {
            white-space: nowrap;
        }

        /* subtle divider between rows */
        .order-row+.order-row {
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, .06);
        }

        /* ================= STATUS COLORS ================= */

        .order-status {
            font-weight: 600;
        }

        .order-status.completed {
            color: var(--success);
        }

        .order-status.pending {
            color: orange;
        }

        .order-status.failed {
            color: var(--danger);
        }

        /* ================= EMPTY STATE ================= */

        .services p {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 1rem;
        }

        /* ===== Loader ===== */

        .global-loader {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .global-loader.active {
            display: flex;
        }

        .loader-box {
            background: var(--card);
            padding: 35px;
            border-radius: var(--radius);
            text-align: center;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid var(--box);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            margin: auto;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Responsive ===== */

        @media (max-width:768px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .menu-btn {
                display: block;
            }

            .services {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <h2>Buyer Panel</h2>
        <ul class="nav-links">
            <li><a href="buyer.html">Browse Services</a></li>
            <li><a class="active" href="#">Orders</a></li>
            <li><a href="addCredits.html">Add Credits</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>
    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="global-loader">
        <div class="loader-box">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
        </div>

        <div id="servicesContainer" class="services"></div>
    </main>

    <script>
        const globalLoader = document.getElementById("globalLoader");

        let activeRequests = 0;

        function showLoader() {
            activeRequests++;
            globalLoader.style.display = "flex";
        }

        function hideLoader() {
            activeRequests--;
            if (activeRequests <= 0) {
                activeRequests = 0;
                globalLoader.style.display = "none";
            }
        }
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) { window.location.href = "../index.html"; }

        /* Sidebar toggle */
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        /* Load buyer orders */
        async function loadBuyerOrders() {
            showLoader();

            try {
                const res = await fetch(`${API_BASE}/orders/buyer`, {
                    headers: { Authorization: `Bearer ${token}` }
                });

                if (!res.ok) throw new Error();

                const data = await res.json();
                renderOrders(data);

            } catch (err) {
                console.log("Failed to load orders", err);
            } finally {
                hideLoader();
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            if (!orders.length) {
                container.innerHTML = "<p>No purchases yet.</p>";
                return;
            }

            orders.forEach(order => {
                const card = document.createElement("div");
                card.className = "service-card";

                card.innerHTML = `
  <img class="service-image"
    src="${order.service?.service_image || 'https://i.imgur.com/placeholder.png'}">
  
  <h3>${order.service?.service_title}</h3>

  <div class="order-row">
    <span><strong>Buyer:</strong> ${order.buyer?.username}</span>
    <span><strong>Total Price:</strong> ${order.totalPrice} credits</span>
  </div>

  <div class="order-row">
    <span><strong>You Received:</strong> ${order.sellerAmount} credits</span>
    <span class="order-status ${order.status?.toLowerCase()}">
      <strong>Status:</strong> ${order.status}
    </span>
  </div>
`;

                container.appendChild(card);
            });
        }

        async function loadCredits(show = false) {
            if (show) showLoader();

            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: {
                        Authorization: "Bearer " + token
                    }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();
                document.getElementById("creditsDisplay").textContent =
                    user.credits ?? 0;

            } catch (err) {
                console.log("Failed to load credits", err);
            } finally {
                if (show) hideLoader();
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            loadBuyerOrders();
            loadCredits(true); // show loader first time
            setInterval(() => loadCredits(false), 15000);
        });
    </script>

</body>

</html>
