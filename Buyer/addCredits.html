<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Buyer Panel – Add Credits</title>
  <style>
    /* ================= DESIGN SYSTEM ================= */

    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #121a2a;
      --box: #1a2440;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --danger: #ff4f4f;

      --radius: 14px;
      --radius-sm: 10px;
      --transition: .25s ease;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= LAYOUT ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 25px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 6px 15px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      color: white;
      text-decoration: none;
      transition: var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    .main {
      margin-left: 240px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* ================= CONTENT ================= */

    .content {
      flex: 1;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }

    /* ================= FORM ================= */

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: .85rem;
      color: var(--muted);
    }

    input {
      padding: 12px;
      background: var(--box);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      cursor: pointer;
      transition: var(--transition);
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      gap: 10px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      background: var(--box);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ================= OVERLAYS ================= */

    /* SIDEBAR OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* LOADER */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    /* POPUP */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4000;
    }

    .loader-overlay.active,
    .popup-overlay.active {
      display: flex;
    }

    .loader-box,
    .popup-box {
      background: var(--card);
      padding: 35px;
      border-radius: var(--radius);
      text-align: center;
      max-width: 380px;
      width: 90%;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid var(--box);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      margin: auto;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* POPUP BUTTON */

    .popup-box button {
      margin-top: 20px;
      padding: 12px 28px;
      min-width: 120px;

      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);

      color: white;
      font-size: 0.95rem;
      font-weight: 600;

      cursor: pointer;
      transition: var(--transition);

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .popup-box button:hover {
      transform: translateY(-1px);
      opacity: .95;
    }

    .popup-box button:active {
      transform: translateY(0);
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
      }

      .menu-btn {
        display: block;
      }

      .content {
        padding: 20px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2>Royal Road</h2>

    <ul class="nav-links" id="navLinks"></ul>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Loader Overlay -->
  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-box">
      <div class="spinner"></div>
      <p>Processing request...</p>
    </div>
  </div>

  <!-- Success Popup -->
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup-box">
      <h3>Request Sent</h3>
      <p>Your request has been forwarded, it will be handled shortly.</p>
      <button id="closePopupBtn">Close</button>
    </div>
  </div>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
    </div>

    <div class="content">
      <div class="card">

        <div class="tabs">
          <button class="tab active" data-tab="buyTab">Add Credits</button>
          <button class="tab" data-tab="sellTab">Sell Credits</button>
        </div>

        <!-- BUY CREDITS -->
        <div id="buyTab" class="tab-content active">
          <form id="buyForm">

            <label>Routing Number</label>
            <input id="buyRouting" placeholder="Numbers only" />

            <label>Discord Tag</label>
            <input id="buyDiscord" placeholder="angel_nunez4" />

            <label>Credit Amount</label>
            <input id="buyCredits" type="number" min="1" placeholder="100" />

            <button type="submit" id="buySubmit">Submit</button>
            <div id="buyStatus" class="status"></div>

          </form>
        </div>

        <!-- SELL CREDITS -->
        <div id="sellTab" class="tab-content">
          <form id="sellForm">

            <label>Routing Number</label>
            <input id="sellRouting" placeholder="Numbers only" />

            <label>Discord Tag</label>
            <input id="sellDiscord" placeholder="angel_nunez4" />

            <label>Credit Amount</label>
            <input id="sellCredits" type="number" min="1" placeholder="100" />

            <button type="submit" id="sellSubmit">Submit</button>
            <div id="sellStatus" class="status"></div>

          </form>
        </div>

      </div>
    </div>
  </main>

  <script type="module">

    import { renderSidebar } from "../methods/sidebar.js";

    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "../index.html";
    }

    /* ================= SIDEBAR ================= */

    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    /* ================= JWT ================= */

    function parseJWT(token) {
      try {
        const payload = token.split(".")[1];
        return JSON.parse(atob(payload));
      } catch {
        return null;
      }
    }

    /* ================= LOAD CREDITS ================= */

    async function loadCredits() {

      try {

        const res = await fetch(`${API_BASE}/users/me`, {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        if (!res.ok) throw new Error();

        const user = await res.json();

        document.getElementById("creditsDisplay").innerHTML = `<span style="color:#2ecc71">${user.credits ?? 0}</span>`;

      } catch (err) {
        console.log("Failed to load credits", err);
      }

    }

    /* ================= TABS ================= */

    const tabs = document.querySelectorAll(".tab");
    const contents = document.querySelectorAll(".tab-content");

    tabs.forEach(tab => {

      tab.addEventListener("click", () => {

        tabs.forEach(t => t.classList.remove("active"));
        contents.forEach(c => c.classList.remove("active"));

        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");

      });

    });

    /* ================= OVERLAYS ================= */

    const loaderOverlay = document.getElementById("loaderOverlay");
    const popupOverlay = document.getElementById("popupOverlay");
    const closePopupBtn = document.getElementById("closePopupBtn");
    function showLoader() {
      loaderOverlay.classList.add("active");
    }

    function hideLoader() {
      loaderOverlay.classList.remove("active");
    }

    function showPopup() {
      popupOverlay.classList.add("active");
    }

    closePopupBtn.addEventListener("click", () => {
      popupOverlay.classList.remove("active");
    });

    /* ================= VALIDATION ================= */

    function validateForm(routingInput, discordInput, creditsInput, status, submitBtn) {

      const routing = routingInput.value.trim();
      const discord = discordInput.value.trim();
      const credits = Number(creditsInput.value.trim());

      submitBtn.disabled = true;
      status.style.color = "red";

      if (!/^\d{9}$/.test(routing))
        return status.textContent = "Routing must be 9 digits.";

      if (!/^(?=.{2,32}$)(?!\.)(?!.*\.\.)([a-zA-Z0-9_.]+)(?<!\.)$/.test(discord))
        return status.textContent = "Invalid Discord tag.";

      if (isNaN(credits) || credits <= 0)
        return status.textContent = "Invalid credit amount.";

      status.style.color = "limegreen";
      status.textContent = "All fields valid ✓";

      submitBtn.disabled = false;
    }

    /* ================= BUY FORM ================= */

    const buyRouting = document.getElementById("buyRouting");
    const buyDiscord = document.getElementById("buyDiscord");
    const buyCredits = document.getElementById("buyCredits");
    const buyStatus = document.getElementById("buyStatus");
    const buySubmit = document.getElementById("buySubmit");

    buySubmit.disabled = true;

    buyRouting.addEventListener("input", () =>
      validateForm(buyRouting, buyDiscord, buyCredits, buyStatus, buySubmit)
    );

    buyDiscord.addEventListener("input", () =>
      validateForm(buyRouting, buyDiscord, buyCredits, buyStatus, buySubmit)
    );

    buyCredits.addEventListener("input", () =>
      validateForm(buyRouting, buyDiscord, buyCredits, buyStatus, buySubmit)
    );

    document.getElementById("buyForm").addEventListener("submit", async (e) => {

      e.preventDefault();
      if (buySubmit.disabled) return;

      showLoader();
      buySubmit.disabled = true;

      try {

        const res = await fetch(`${API_BASE}/discord/credits-request`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({
            type: "buy",
            routing_number: buyRouting.value.trim(),
            amount_credits: Number(buyCredits.value.trim()),
            discord_tag: buyDiscord.value.trim()
          })
        });

        if (!res.ok) throw new Error();

        showPopup();

        e.target.reset();
        buySubmit.disabled = true;
        buyStatus.textContent = "";

      } catch (err) {

        buyStatus.style.color = "red";
        buyStatus.textContent = "API error occurred.";

      } finally {

        hideLoader();

      }

    });

    /* ================= SELL FORM ================= */

    const sellRouting = document.getElementById("sellRouting");
    const sellDiscord = document.getElementById("sellDiscord");
    const sellCredits = document.getElementById("sellCredits");
    const sellStatus = document.getElementById("sellStatus");
    const sellSubmit = document.getElementById("sellSubmit");

    sellSubmit.disabled = true;

    sellRouting.addEventListener("input", () =>
      validateForm(sellRouting, sellDiscord, sellCredits, sellStatus, sellSubmit)
    );

    sellDiscord.addEventListener("input", () =>
      validateForm(sellRouting, sellDiscord, sellCredits, sellStatus, sellSubmit)
    );

    sellCredits.addEventListener("input", () =>
      validateForm(sellRouting, sellDiscord, sellCredits, sellStatus, sellSubmit)
    );

    document.getElementById("sellForm").addEventListener("submit", async (e) => {

      e.preventDefault();
      if (sellSubmit.disabled) return;

      showLoader();
      sellSubmit.disabled = true;

      try {

        const res = await fetch(`${API_BASE}/discord/credits-request`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({
            type: "sell",
            routing_number: sellRouting.value.trim(),
            amount_credits: Number(sellCredits.value.trim()),
            discord_tag: sellDiscord.value.trim()
          })
        });

        if (!res.ok) throw new Error();

        showPopup();

        e.target.reset();
        sellSubmit.disabled = true;
        sellStatus.textContent = "";

      } catch (err) {

        sellStatus.style.color = "red";
        sellStatus.textContent = "API error occurred.";

      } finally {

        hideLoader();

      }

    });

    /* ================= INIT ================= */

    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      loadCredits();
      setInterval(loadCredits, 15000);
    });

  </script>
</body>

</html>
