<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Buyer Panel – Add Credits</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #121a2a;
      --box: #1a2440;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      background: var(--panel);
      padding-top: 20px;
      transition: transform 0.3s ease;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 6px 10px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(96, 96, 96, 0.4);
    }

    /* Main */
    .main {
      margin-left: 240px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      /* removed background */
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text);
      cursor: pointer;
    }

    .content {
      padding: 25px;
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    input {
      padding: 10px;
      background: var(--box);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text);
    }

    button {
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      font-size: 0.9rem;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
    }

    .overlay.active {
      display: block;
    }

    /* Loader */
    .loader-overlay,
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .loader-box,
    .popup-box {
      background: var(--card);
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      max-width: 350px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--box);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      margin: auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width:768px) {

      .main {
        margin-left: 0;
      }

      .sidebar {
        transform: translateX(-100%);
        z-index: 1500;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-btn {
        display: block;
      }

      .topbar {
        padding: 15px 18px;
      }

      .content {
        padding: 18px;
      }

      .card {
        padding: 18px;
      }

    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2>Buyer Panel</h2>
    <ul class="nav-links">
      <li><a href="buyer.html">Browse Services</a></li>
      <li><a href="buyerOrder.html">Orders</a></li>
      <li><a class="active" href="addCredits.html">Add Credits</a></li>
      <li><a href="../index.html">Logout</a></li>
    </ul>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Loader Overlay -->
  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-box">
      <div class="spinner"></div>
      <p>Processing request...</p>
    </div>
  </div>

  <!-- Success Popup -->
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup-box">
      <h3>Request Sent</h3>
      <p>Your request has been forwarded, it will be handled shortly.</p>
      <button id="closePopupBtn">OK</button>
    </div>
  </div>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
    </div>

    <div class="content">
      <div class="card">
        <h2>Add Credits</h2>

        <form id="creditForm">
          <label>Routing Number</label>
          <input id="routingNumber" placeholder="Numbers only" />

          <label>Discord Tag</label>
          <input id="discordTag" placeholder="angel_nunez4" />

          <label>Credit Amount</label>
          <input id="credits" type="number" min="1" placeholder="100" />

          <button type="submit" id="submitBtn">Submit</button>
          <div id="status" class="status"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "../index.html";
    }

    /* Sidebar */
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    /* JWT */
    function parseJWT(token) {
      try {
        const payload = token.split(".")[1];
        return JSON.parse(atob(payload));
      } catch {
        return null;
      }
    }

    function loadCredits() {
      async function loadCredits() {
        try {
          const res = await fetch(`${API_BASE}/users/me`, {
            headers: {
              Authorization: "Bearer " + token
            }
          });

          if (!res.ok) throw new Error();

          const user = await res.json();

          document.getElementById("creditsDisplay").textContent =
            user.credits ?? 0;

        } catch {
          console.log("Failed to load credits");
        }
      }
    }

    /* Form */
    const form = document.getElementById("creditForm");
    const routingInput = document.getElementById("routingNumber");
    const discordInput = document.getElementById("discordTag");
    const creditsInput = document.getElementById("credits");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    const loaderOverlay = document.getElementById("loaderOverlay");
    const popupOverlay = document.getElementById("popupOverlay");
    const closePopupBtn = document.getElementById("closePopupBtn");

    submitBtn.disabled = true;

    function validate() {
      const routing = routingInput.value.trim();
      const discord = discordInput.value.trim();
      const credits = Number(creditsInput.value.trim());

      submitBtn.disabled = true;
      status.style.color = "red";

      if (!/^\d{9}$/.test(routing))
        return status.textContent = "Routing must be 9 digits.";

      if (!/^[a-zA-Z0-9_]+$/.test(discord))
        return status.textContent = "Invalid Discord tag.";

      if (isNaN(credits) || credits <= 0)
        return status.textContent = "Invalid credit amount.";

      status.style.color = "limegreen";
      status.textContent = "All fields valid ✓";
      submitBtn.disabled = false;
    }

    routingInput.addEventListener("input", validate);
    discordInput.addEventListener("input", validate);
    creditsInput.addEventListener("input", validate);

    function showLoader() {
      loaderOverlay.style.display = "flex";
    }

    function hideLoader() {
      loaderOverlay.style.display = "none";
    }

    function showPopup() {
      popupOverlay.style.display = "flex";
    }

    closePopupBtn.addEventListener("click", () => {
      popupOverlay.style.display = "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submitBtn.disabled) return;

      showLoader();
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/discord/credits-request`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({
            type: "buy",
            routing_number: routingInput.value.trim(),
            amount_credits: Number(creditsInput.value.trim()),
            discord_tag: discordInput.value.trim()
          })
        });

        if (!res.ok) throw new Error("Server error");

        showPopup();
        form.reset();
        submitBtn.disabled = true;
        status.textContent = "";

      } catch (err) {
        status.textContent = "API error occurred.";
      } finally {
        hideLoader();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      loadCredits();
      setInterval(loadCredits, 15000); // refresh every 15 seconds
    });
  </script>
</body>

</html>
