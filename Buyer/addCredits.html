<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Buyer Panel – Add Credits</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #121a2a;
      --box: #1a2440;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --shadow: rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.3rem;
    }

    .nav-links {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    .nav-links li {
      margin: 6px 10px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(96, 96, 96, 0.432);
    }

    /* Main */
    .main {
      margin-left: 240px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-btn {
      font-size: 1.5rem;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: none;
    }

    /* Content */
    .content {
      padding: 25px;
      overflow-y: auto;
      flex: 1;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    input {
      padding: 10px 14px;
      background: var(--box);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    button {
      margin-top: 10px;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* Overlay (mobile) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    @media (max-width: 768px) {
      .main {
        margin-left: 0;
      }

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2>Buyer Panel</h2>
    <ul class="nav-links">
      <li><a href="buyer.html">Browse Services</a></li>
      <li><a href="#">Orders</a></li>
      <li><a href="#">Messages</a></li>
      <li><a class="active" href="addCredits.html">Add Credits</a></li>
      <li><a href="#">Settings</a></li>
      <li><a href="#">Logout</a></li>
    </ul>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <span>Add Credits</span>
    </div>

    <div class="content">
      <div class="card">
        <h2>Add Credits</h2>

        <form id="creditForm">
          <label>Routing Number</label>
          <input id="routingNumber" placeholder="Numbers only" />

          <label>Discord Tag</label>
          <input id="discordTag" placeholder="angel_nunez4" />

          <label>Credit Amount</label>
          <input id="credits" type="number" min="1" placeholder="100" />

          <button type="submit">Submit</button>
          <div id="status" class="status"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    const form = document.getElementById("creditForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      status.textContent = "";
      status.style.color = "red";

      const routingNumber = document.getElementById("routingNumber").value.trim();
      const discordTag = document.getElementById("discordTag").value.trim();
      const credits = document.getElementById("credits").value.trim();

      // ===== PRECHECKS =====

      // 1. Empty checks
      if (!routingNumber || !discordTag || !credits) {
        status.textContent = "All fields are required.";
        return;
      }

      // 2. Routing number numeric + length check
      if (!/^\d+$/.test(routingNumber)) {
        status.textContent = "Routing number must be numeric.";
        return;
      }

      if (routingNumber.length !== 9) {
        status.textContent = "Routing number must be 9 digits.";
        return;
      }

      // 3. Discord tag format
      if (!/^[a-zA-Z0-9_]+$/.test(discordTag)) {
        status.textContent = "Invalid Discord tag format.";
        return;
      }

      // 4. Credit amount validation
      const creditAmount = Number(credits);

      if (isNaN(creditAmount) || creditAmount <= 0) {
        status.textContent = "Enter a valid credit amount.";
        return;
      }

      if (creditAmount > 10000) {
        if (!confirm("Large credit request. Continue?")) return;
      }

      // 5. Auth token check
      const token = localStorage.getItem("token");
      if (!token) {
        status.textContent = "You must be logged in.";
        return;
      }

      // Disable button to prevent spam
      const submitBtn = form.querySelector("button[type='submit']");
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      // ===== API CALL =====

      try {
        const res = await fetch(
          "https://gtaw-project.vercel.app/discord/request-approval",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
              routing_number: routingNumber,
              amount_credits: creditAmount,
              discord_tag: discordTag
            })
          }
        );

        if (!res.ok) throw new Error("Server error " + res.status);

        const data = await res.json();
        console.log(data);

      } catch (err) {
        status.textContent = "API error: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
      }
    });

  </script>

</body>

</html>
