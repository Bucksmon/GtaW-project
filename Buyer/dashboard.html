<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="icon" type="image/png" href="../Royal Road.png">

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --danger: #ff4f4f;

      --radius: 16px;
      --radius-sm: 12px;
      --transition: .25s ease;
    }

    /* ================= BASE ================= */

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }

    /* ================= SIDEBAR LOGO FIX ================= */

    .logo-title {
      display: flex;
      align-items: center;
      /* 🔥 vertical alignment */
      justify-content: center;
      /* keep centered like your current UI */
      gap: 10px;
      /* space between logo & text */

      margin-bottom: 30px;
    }

    /* override old rule */
    .sidebar h2.logo-title {
      text-align: center;
      /* keep consistency */
    }

    /* logo sizing */
    .logo-title img {
      height: 34px;
      width: 34px;
      object-fit: contain;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 250px;
      padding: 60px 40px;
      min-height: 100vh;
    }

    /* ================= TOPBAR ================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
    }

    .topbar h2 {
      margin: 0;
      font-weight: 600;
    }

    .topbar span {
      color: var(--accent);
      font-weight: 600;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* ================= GRID ================= */

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
      gap: 30px;
      align-items: stretch;
    }

    /* ================= CARD ================= */

    .service-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
      transition: var(--transition);
      height: 100%;
      min-height: 360px;
      position: relative;
      overflow: hidden;
    }

    .sold-overlay {
      position: absolute;
      inset: 0;

      background: rgba(255, 0, 0, 0.7);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 20;

      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: white;

      backdrop-filter: blur(2px);
      text-transform: uppercase;
    }

    .service-card:hover {
      transform: translateY(-6px);
    }

    /* ================= IMAGE ================= */

    .service-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--box);
      flex-shrink: 0;
    }

    /* ================= TITLE ================= */

    .service-card h3 {
      margin: 0;
      font-size: 1.1rem;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ================= DESCRIPTION ================= */

    .service-card p {
      margin: 0;
      font-size: .9rem;
      color: var(--muted);

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .service-card strong {
      color: var(--text);
    }

    /* ================= META ROW ================= */

    .service-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, .06);
      margin-top: 4px;
    }

    .service-meta span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 48%;
    }

    /* ================= BUTTON ================= */

    .service-card button {
      margin-top: auto;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .service-card button:hover {
      opacity: .9;
    }

    .service-card button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .service-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 14px;

      margin-top: auto;
      padding-top: 12px;

      border-top: 1px solid rgba(255, 255, 255, .06);
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;

      background: rgba(255, 255, 255, .04);

      padding: 8px 12px;

      border-radius: 12px;
    }

    .quantity-box label {
      font-size: .9rem;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .quantity-box input {
      width: 75px;

      padding: 10px;

      border: none;
      outline: none;

      border-radius: 10px;

      background: var(--box);

      color: white;

      text-align: center;

      font-weight: 600;
    }

    .buy-btn {
      min-width: 140px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;
    }

    /* ================= EMPTY STATE ================= */

    .services p {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ================= PAGINATION ================= */

    #pagination {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    #pagination button {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--box);
      color: var(--text);
      cursor: pointer;
      transition: var(--transition);
    }

    #pagination button:hover {
      background: var(--accent);
    }

    #pagination button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* ================= LOADER ================= */

    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .loader-overlay.show {
      display: flex;
    }

    .popup {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, .2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width:768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }
    }

    /* ================= POPUP BUTTONS ================= */

    .popup-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      min-width: 120px;
    }

    .popup-btn.primary {
      background: var(--accent);
      color: white;
    }

    .popup-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(79, 140, 255, 0.3);
    }

    .popup-btn.secondary {
      background: var(--box);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .popup-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .popup-btn:active {
      transform: scale(0.96);
    }

    /* ================= PROFILE POPUP ONLY ================= */

    /* Make popup responsive (only this one) */
    #profilePopup .popup {
      width: 90%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Allow text to wrap nicely */
    #profilePopup .popup span {
      white-space: normal;
      word-break: break-word;
    }

    /* Target ONLY the button container (your inline div) */
    #profilePopup .popup>div {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      /* ✅ center horizontally */
    }

    #profilePopup .popup span:first-child {
      font-size: 1.05rem;
    }

    #profilePopup .popup span:nth-child(2) {
      line-height: 1.4;
    }

    /* ================= MOBILE BEHAVIOR ================= */

    @media (max-width: 500px) {

      /* Shrink popup more */
      #profilePopup .popup {
        max-width: 300px;
        padding: 18px;
      }

      #profilePopup .popup>div {
        flex-direction: column;
        align-items: center;
        /* ✅ center vertically stacked buttons */
      }

      #profilePopup .popup-btn {
        width: 100%;
        max-width: 220px;
        /* optional: prevents ugly full stretch */
      }
    }

    /* Remove number input arrows/spinners */

    .quantity-box input::-webkit-outer-spin-button,
    .quantity-box input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .quantity-box input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>

</head>

<body>

  <aside class="sidebar" id="sidebar">
    <h2>Royal Road</h2>
    <ul class="nav-links" id="navLinks"></ul>
  </aside>

  <div class="overlay" id="overlay"></div>
  <!-- Global Loader -->
  <div id="loaderOverlay" class="loader-overlay">
    <div class="popup">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>
  <div id="profilePopup" class="loader-overlay">
    <div class="popup" style="flex-direction: column; text-align: center;">
      <span style="font-weight: 600;">Complete Your Profile</span>
      <span style="font-size: 0.9rem; color: var(--muted);">
        Please set your Mobile Number and Discord Tag before purchasing.
      </span>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="goSettingsBtn" class="popup-btn primary">Go to Settings</button>
        <button id="closePopupBtn" class="popup-btn secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="messagePopup" class="loader-overlay">

    <div class="popup" style="
    flex-direction: column;
    text-align: center;
    max-width: 420px;
    width: 90%;
  ">

      <span id="messagePopupTitle" style="
      font-weight: 700;
      font-size: 1.1rem;
    ">
        Notice
      </span>

      <span id="messagePopupText" style="
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 8px;
    ">
      </span>

      <div id="messagePopupButtons" style="
      display:flex;
      gap:10px;
      margin-top:20px;
      justify-content:center;
      flex-wrap:wrap;
    ">
      </div>

    </div>

  </div>
  <main class="main">

    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Credits: <span style="color:#2ecc71" id="creditsDisplay">0</span></h2>
    </div>

    <div id="servicesContainer" class="services"></div>
    <div id="pagination"></div>

  </main>

  <script type="module">
    import { renderSidebar } from "../methods/sidebar.js";
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "../index.html";
    }
    let currentUser = null;
    const loaderOverlay = document.getElementById("loaderOverlay");

    function showLoader() {
      loaderOverlay.classList.add("show");
    }

    function hideLoader() {
      loaderOverlay.classList.remove("show");
    }
    /* ===== Sidebar Toggle ===== */
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    const profilePopup = document.getElementById("profilePopup");

    function showProfilePopup() {
      profilePopup.classList.add("show");
    }

    function hideProfilePopup() {
      profilePopup.classList.remove("show");
    }
    const messagePopup = document.getElementById("messagePopup");
    const messagePopupTitle = document.getElementById("messagePopupTitle");
    const messagePopupText = document.getElementById("messagePopupText");
    const messagePopupButtons = document.getElementById("messagePopupButtons");

    function closeMessagePopup() {
      messagePopup.classList.remove("show");
    }

    function showPopup({
      title = "Notice",
      message = "",
      buttons = []
    }) {

      messagePopupTitle.textContent = title;
      messagePopupText.textContent = message;

      messagePopupButtons.innerHTML = "";

      buttons.forEach(btn => {

        const button = document.createElement("button");

        button.className =
          `popup-btn ${btn.type || "primary"}`;

        button.textContent = btn.text;

        button.onclick = () => {

          closeMessagePopup();

          if (btn.onClick) {
            btn.onClick();
          }

        };

        messagePopupButtons.appendChild(button);

      });

      messagePopup.classList.add("show");

    }

    document.getElementById("closePopupBtn").onclick = hideProfilePopup;

    document.getElementById("goSettingsBtn").onclick = () => {
      window.location.href = "../Settings.html";
    };

    let currentPage = 1;

    async function loadServices(page = 1) {
      showLoader();

      try {
        const res = await fetch(`${API_BASE}/services?page=${page}&limit=8`, {
          headers: {
            Authorization: `Bearer ${token}`
          },
          cache: "no-store"
        });

        const data = await res.json();
        if (!res.ok) throw new Error("Failed to load services");

        renderServices(data.services || []);
        renderPagination(
          data.pagination?.currentPage || 1,
          data.pagination?.totalPages || 1
        );

      } catch (err) {
        console.error(err);
      } finally {
        hideLoader();
      }
    }

    function renderServices(services) {
      const container = document.getElementById("servicesContainer");
      container.innerHTML = "";

      if (!services.length) {
        container.innerHTML = "<p>No services found.</p>";
        return;
      }

      services.forEach(service => {
        const card = document.createElement("div");

        card.className = "service-card";

        card.innerHTML = `
  <img class="service-image"
       src="${service.service_image || 'https://i.imgur.com/placeholder.png'}"
       alt="Service Image">
  <h3>${service.service_title || "No title"}</h3>
  <p>${service.service_description || "No description"}</p>

  <div class="service-meta">
  <span>
    <strong>💰 Price:</strong> 
    <span style="color: #2ecc71">
     ${service.service_price || 0}
    </span>
  </span>

  <span>
    <strong>👤 Seller:</strong> 
    ${service.service_sellerId?.nickName || "Anonymous"}
  </span>
</div>

${service.service_type === "quantity" ? `
<div class="service-meta">

  <span>
    <strong>Stock:</strong>

    <span style="
      color:${service.quantity > 0 ? '#2ecc71' : '#ff4f4f'}
    ">
      ${service.quantity || 0}
    </span>
  </span>

  <span>
    <strong>💰 Total:</strong>

    <span 
      id="checkout-price-${service._id}"
      style="color:#2ecc71;"
    >
      ${service.service_price}
    </span>
  </span>

</div>
` : ""}

  ${service.service_type === "quantity" && service.quantity <= 0
            ? ""
            : `<div class="service-actions">

  ${service.service_type === "quantity" ? `

    <div class="quantity-box">

      <label for="buy-qty-${service._id}">
        📦 Quantity
      </label>

      <input
        type="number"
        min="1"
        max="${service.quantity}"
        value="1"
        class="buy-qty"
        id="buy-qty-${service._id}"
      />

    </div>

  ` : `<div></div>`}

  <button 
    class="buy-btn"
    data-id="${service._id}"
  >
    🛒 Buy
  </button>

</div>`
          }
  ${service.service_type === "quantity" && service.quantity <= 0
            ? `
    <div class="sold-overlay">
      SOLD OUT
    </div>
  `
            : ""
          }
`;

        container.appendChild(card);
        const btn = card.querySelector(".buy-btn");
        if (service.service_type === "quantity") {

          const qtyInput =
            document.getElementById(`buy-qty-${service._id}`);

          const checkoutEl =
            document.getElementById(`checkout-price-${service._id}`);

          qtyInput.addEventListener("input", () => {

            let qty = Number(qtyInput.value);

            // Allow empty while typing
            if (qtyInput.value === "") {
              checkoutEl.textContent = "0";
              return;
            }

            // Prevent invalid values
            if (isNaN(qty) || qty < 0) {
              qty = 0;
            }

            // Prevent exceeding stock
            if (qty > service.quantity) {
              qty = service.quantity;
              qtyInput.value = qty;
            }

            // Remove decimals
            qty = Math.floor(qty);

            qtyInput.value = qty;

            const total =
              qty * service.service_price;

            checkoutEl.textContent = total;

          });

        }
        if (btn) {
          btn.addEventListener("click", async () => {

            let quantity = 1;

            if (service.service_type === "quantity") {

              const qtyInput =
                document.getElementById(`buy-qty-${service._id}`);

              quantity = Number(qtyInput.value);

              if (!qtyInput.value || quantity < 1) {

                showPopup({
                  title: "Invalid Quantity",
                  message: "Quantity must be at least 1.",
                  buttons: [
                    {
                      text: "Okay",
                      type: "primary"
                    }
                  ]
                });

                return;
              }

              if (quantity > service.quantity) {

                showPopup({
                  title: "Insufficient Stock",
                  message: `Only ${service.quantity} item(s) available.`,
                  buttons: [
                    {
                      text: "Okay",
                      type: "primary"
                    }
                  ]
                });

                return;
              }
              const checkoutPrice =
                quantity * service.service_price;

              if (currentUser.credits < checkoutPrice) {

                showPopup({
                  title: "Insufficient Credits",

                  message:
                    `You need ${checkoutPrice} credits but only have ${currentUser.credits}.`,

                  buttons: [
                    {
                      text: "Okay",
                      type: "primary"
                    }
                  ]
                });

                return;
              }

            }

            btn.disabled = true;
            btn.textContent = "Processing...";

            await buyService(service._id, quantity);

            btn.disabled = false;
            btn.textContent = "🛒 Buy";

          });
        }
      });
    }

    function renderPagination(current, total) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";

      for (let i = 1; i <= total; i++) {

        const btn = document.createElement("button");

        btn.textContent = i;

        // Active page styling
        if (i === current) {
          btn.style.background = "var(--accent)";
          btn.style.color = "#fff";
          btn.style.fontWeight = "700";
        }

        btn.onclick = () => {
          currentPage = i;
          loadServices(i);
        };

        pagination.appendChild(btn);
      }
    }

    async function buyService(serviceId, quantity = 1) {

      const isMissing =
        !currentUser?.mobileNumber?.trim() ||
        !currentUser?.discordTag?.trim();

      if (isMissing) {
        showProfilePopup();
        return;
      }
      showLoader();
      try {
        try {
          const res = await fetch(`${API_BASE}/orders/buyservice`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              serviceId,
              quantity
            })
          });

          const data = await res.json();
          if (!res.ok) return showPopup({
            title: "Purchase Failed",
            message: data.error || "Something went wrong.",
            buttons: [
              {
                text: "Close",
                type: "primary"
              }
            ]
          });
          document.getElementById("creditsDisplay").innerHTML = `<span style="color:#2ecc71">${data.newCredits ?? 0}</span>`;
          await loadServices(currentPage);
          showPopup({
            title: "Purchase Successful",
            message: `Successfully purchased ${quantity} item(s).`,
            buttons: [
              {
                text: "Awesome",
                type: "primary"
              }
            ]
          });

        } catch (err) {
          console.error(err);
        }
      } finally {
        hideLoader();
      }
    }

    async function loadCredits(show = false) {
      if (show) showLoader();

      try {
        const res = await fetch(`${API_BASE}/users/me`, {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        if (!res.ok) throw new Error();

        const user = await res.json();
        currentUser = user;

        document.getElementById("creditsDisplay").innerHTML = `<span style="color:#2ecc71">${user.credits ?? 0}</span>`;

      } catch (err) {
        console.log(err);
      } finally {
        if (show) hideLoader();
      }
    }
    profilePopup.addEventListener("click", (e) => {
      if (e.target === profilePopup) {
        hideProfilePopup();
      }
    });
    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      loadServices(currentPage);
      loadCredits(true); // show loader first time
      setInterval(() => loadCredits(false), 15000);
    });
  </script>

</body>

</html>
