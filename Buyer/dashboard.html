<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Buyer Panel</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #23c826;
      --danger: #ff4f4f;

      --radius: 16px;
      --radius-sm: 12px;
      --transition: .25s ease;
    }

    /* ================= BASE ================= */

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 250px;
      padding: 60px 40px;
      min-height: 100vh;
    }

    /* ================= TOPBAR ================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
    }

    .topbar h2 {
      margin: 0;
      font-weight: 600;
    }

    .topbar span {
      color: var(--accent);
      font-weight: 600;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* ================= GRID ================= */

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    /* ================= CARD ================= */

    .service-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
      transition: var(--transition);
    }

    .service-card:hover {
      transform: translateY(-6px);
    }

    .service-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--box);
    }

    .service-card h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .service-card p {
      margin: 0;
      font-size: .9rem;
      color: var(--muted);
    }

    .service-card strong {
      color: var(--text);
    }

    /* ================= BUTTON ================= */

    .service-card button {
      margin-top: auto;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .service-card button:hover {
      opacity: .9;
    }

    .service-card button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* ================= META ROW ================= */

    .service-meta {
      display: flex;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, .06);
      margin-top: 4px;
    }

    .service-meta span {
      white-space: nowrap;
    }

    /* ================= EMPTY STATE ================= */

    .services p {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ================= PAGINATION ================= */

    #pagination {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    #pagination button {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--box);
      color: var(--text);
      cursor: pointer;
      transition: var(--transition);
    }

    #pagination button:hover {
      background: var(--accent);
    }

    #pagination button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* ================= GLOBAL LOADER ================= */

    .global-loader {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .loader-box {
      background: var(--card);
      padding: 40px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    .spinner-large {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, .2);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      margin: auto;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width:768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }

    }
  </style>
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <h2>Buyer Panel</h2>
    <ul class="nav-links" id="navLinks"></ul>
  </aside>

  <div class="overlay" id="overlay"></div>
  <!-- Global Loader -->
  <div id="globalLoader" class="global-loader">
    <div class="loader-box">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>
  <main class="main">

    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
    </div>

    <div id="servicesContainer" class="services"></div>
    <div id="pagination"></div>

  </main>

  <script type="module">
    import { renderSidebar } from "../methods/sidebar.js";
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "../index.html";
    }
    const globalLoader = document.getElementById("globalLoader");

    let activeRequests = 0;

    function showLoader() {
      activeRequests++;
      globalLoader.style.display = "flex";
    }

    function hideLoader() {
      activeRequests--;
      if (activeRequests <= 0) {
        activeRequests = 0;
        globalLoader.style.display = "none";
      }
    }
    /* ===== Sidebar Toggle ===== */
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });


    let currentPage = 1;

    async function loadServices(page = 1) {
      showLoader();

      try {
        const res = await fetch(`${API_BASE}/services?page=${page}&limit=8`, {
          headers: {
            Authorization: `Bearer ${token}`
          },
          cache: "no-store"
        });

        const data = await res.json();
        if (!res.ok) throw new Error("Failed to load services");

        renderServices(data.services || []);
        renderPagination(data.page || 1, data.totalPages || 1);

      } catch (err) {
        console.error(err);
      } finally {
        hideLoader();
      }
    }

    function renderServices(services) {
      const container = document.getElementById("servicesContainer");
      container.innerHTML = "";

      if (!services.length) {
        container.innerHTML = "<p>No services found.</p>";
        return;
      }

      services.forEach(service => {
        const card = document.createElement("div");

        card.className = "service-card";

        card.innerHTML = `
  <img class="service-image"
       src="${service.service_image || 'https://i.imgur.com/placeholder.png'}"
       alt="Service Image">
  <h3>${service.service_title || "No title"}</h3>
  <p>${service.service_description || "No description"}</p>

  <div class="service-meta">
    <span><strong>Price:</strong> <span style="color: var(--accent);">${service.service_price || 0}</span></span>
    <span><strong>Seller:</strong> ${service.service_sellerId?.username || "Unknown"}</span>
  </div>

  <button class="buy-btn" data-id="${service._id}">Buy</button>
`;

        container.appendChild(card);
        const btn = card.querySelector(".buy-btn");
        btn.addEventListener("click", () => buyService(service._id));
      });
    }

    function renderPagination(current, total) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";

      for (let i = 1; i <= total; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        if (i === current) btn.disabled = true;
        btn.onclick = () => {
          currentPage = i;
          loadServices(i);
        };
        pagination.appendChild(btn);
      }
    }

    async function buyService(serviceId) {
      showLoader();
      try {
        try {
          window.alert("service:", typeof serviceId);
          const res = await fetch(`${API_BASE}/orders/buyservice`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ serviceId: serviceId })
          });

          const data = await res.json();
          if (!res.ok) return alert(data.error || "Purchase failed");

          alert("Service purchased!");
          document.getElementById("creditsDisplay").textContent = data.buyerCredits;

        } catch (err) {
          console.error(err);
        }
      } finally {
        hideLoader();
      }
    }

    async function loadCredits(show = false) {
      if (show) showLoader();

      try {
        const res = await fetch(`${API_BASE}/users/me`, {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        if (!res.ok) throw new Error();

        const user = await res.json();
        document.getElementById("creditsDisplay").textContent =
          user.credits ?? 0;

      } catch (err) {
        console.log(err);
      } finally {
        if (show) hideLoader();
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      loadServices(currentPage);
      loadCredits(true); // show loader first time
      setInterval(() => loadCredits(false), 15000);
    });
  </script>

</body>

</html>
