<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin Panel - Orders</title>
    <link rel="icon" type="image/png" href="../Royal Road.png">

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #151e33;
            --box: #1e2945;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --success: #2ecc71;
            --danger: #ff4f4f;

            --radius: 16px;
            --radius-sm: 12px;
            --transition: .25s ease;
        }

        /* ================= BASE ================= */

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, .06);
            padding: 30px 0;
            transition: transform var(--transition);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* ================= SIDEBAR LOGO FIX ================= */

        .logo-title {
            display: flex;
            align-items: center;
            /* 🔥 vertical alignment */
            justify-content: center;
            /* keep centered like your current UI */
            gap: 10px;
            /* space between logo & text */

            margin-bottom: 30px;
        }

        /* override old rule */
        .sidebar h2.logo-title {
            text-align: center;
            /* keep consistency */
        }

        /* logo sizing */
        .logo-title img {
            height: 34px;
            width: 34px;
            object-fit: contain;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 8px 18px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, .08);
        }

        /* ================= OVERLAY ================= */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 250px;
            padding: 60px 40px;
            min-height: 100vh;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .topbar h2 {
            margin: 0;
            font-weight: 600;
        }

        .topbar span {
            color: var(--accent);
            font-weight: 600;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text);
            cursor: pointer;
        }

        /* ================= GRID ================= */

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 30px;
        }

        /* ================= CARD ================= */

        .service-card {
            background: var(--card);
            padding: 22px;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-6px);
        }

        .service-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--box);
        }

        .service-card h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .service-card p {
            margin: 0;
            font-size: .9rem;
            color: var(--muted);
        }

        .service-card strong {
            color: var(--text);
        }

        /* ================= ORDER STATUS COLORS ================= */

        .service-card p:last-child {
            font-weight: 600;
        }

        .service-card p:last-child:contains("completed"),
        .service-card p:last-child:contains("Completed") {
            color: var(--success);
        }

        /* ================= ORDER ROW ================= */

        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: .9rem;
            color: var(--muted);
        }

        .order-row span {
            white-space: nowrap;
        }

        /* subtle divider between rows */
        .order-row+.order-row {
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, .06);
        }

        /* ================= STATUS COLORS ================= */

        .order-status {
            font-weight: 600;
        }

        .order-status.completed {
            color: var(--success);
        }

        .order-status.pending {
            color: orange;
        }

        .order-status.failed {
            color: var(--danger);
        }

        /* ================= EMPTY STATE ================= */

        .services p {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 1rem;
        }

        /* ================= TABS ================= */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 18px;
            min-width: 140px;
            background: var(--box);
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text);
            cursor: pointer;
            text-align: center;
        }

        .tab.active {
            background: var(--accent);
        }

        /* ================= LOADER ================= */

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .loader-overlay.show {
            display: flex;
        }

        .popup {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, .2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width:768px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 30px 20px;
            }

            .menu-btn {
                display: block;
            }

        }

        /* ================= PAGINATION ================= */

        #pagination {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #pagination button {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, .08);
            background: var(--box);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
        }

        #pagination button:hover {
            background: var(--accent);
        }

        #pagination button:disabled {
            background: var(--accent);
            cursor: default;
        }

        .status-dropdown {
            padding: 6px 10px;
            border-radius: 8px;
            background: #1e2945;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .status-dropdown.completed {
            border-color: #2ecc71;
        }

        .status-dropdown.pending {
            border-color: orange;
        }

        .status-dropdown.cancelled {
            border-color: #ff4f4f;
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <h2>Royal Road</h2>
        <ul class="nav-links" id="navLinks"></ul>
    </aside>

    <div class="overlay" id="overlay"></div>
    <!-- GLOBAL LOADER -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="popup">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>
                Credits: <span id="creditsDisplay">0</span>
                <span id="siteBalanceWrapper" style="margin-left:15px; display:none;">
                    | Site Balance: <span id="siteBalanceDisplay">0</span>
                </span>
            </h2>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="buy">Buy Orders</button>
            <button class="tab" data-tab="sell">Sell Orders</button>
        </div>
        <div id="servicesContainer" class="services"></div>
        <div id="pagination"></div>
    </main>

    <script type="module">
        import { renderSidebar } from "../methods/sidebar.js";
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "../index.html";
        const loaderOverlay = document.getElementById("loaderOverlay");
        let currentPage = 1;
        const limit = 6;
        let currentUser = null;

        function showLoader() {
            loaderOverlay.classList.add("show");
        }

        function hideLoader() {
            loaderOverlay.classList.remove("show");
        }

        /* ================= SIDEBAR ================= */

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        /* ================= LOAD ORDERS ================= */

        let activeTab = "buy";

        async function loadOrders(page = 1) {
            showLoader();

            try {
                let type;

                if (["superadmin", "admin"].includes(currentUser?.role)) {
                    type = "all"; // admin sees everything
                } else {
                    type = activeTab === "buy" ? "buyer" : "seller";
                }

                const res = await fetch(
                    `${API_BASE}/orders?type=${type}&page=${page}&limit=${limit}`,
                    {
                        headers: { Authorization: `Bearer ${token}` },
                        cache: "no-store"
                    }
                );

                if (!res.ok) throw new Error();

                const data = await res.json();

                renderOrders(data.orders || []);
                renderPagination(data.pagination);

            } catch (err) {
                console.error("Failed to load orders:", err);
            } finally {
                hideLoader();
            }
        }

        const tabs = document.querySelectorAll(".tab");

        tabs.forEach(tab => {
            tab.addEventListener("click", () => {

                tabs.forEach(t => t.classList.remove("active"));
                tab.classList.add("active");

                activeTab = tab.dataset.tab;

                currentPage = 1; // reset page on switch
                loadOrders(currentPage);
            });
        });
        /* ================= RENDER ORDERS ================= */

        function renderOrders(orders) {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            if (!orders.length) {
                container.innerHTML = "<p>No orders yet.</p>";
                return;
            }

            orders.forEach(order => {
                const card = document.createElement("div");
                card.className = "service-card";
                card.innerHTML = `
        <img class="service-image"
            src="${order.service?.service_image || 'https://i.imgur.com/placeholder.png'}">
        
        <h3>${order.service?.service_title}</h3>

        <div class="order-row">
           <span>
                <strong>${activeTab === "buy" ? "Buyer:" : "Seller:"}</strong>
                ${activeTab === "buy"
                        ? (order.buyer?.username || "Anonymous")
                        : (order.seller?.username || "Anonymous")
                    }
            </span>
            <span><strong>Total Price:</strong> <span style="color:#2ecc71;">${order.totalPrice}</span></span>
        </div>

        <div class="order-row">
            <span>
                <strong>${activeTab === "buy" ? "Buyer Paid" : "Seller Received"}:</strong>
                <span style="color:#2ecc71;"> ${order.sellerAmount}</span>
            </span>
            ${(() => {
                        const status = order.status?.toLowerCase();

                        return `
        <select 
            class="status-dropdown ${status}" 
            data-id="${order._id}" 
            data-prev="${status}"
        >   
            <option value="pending" ${status === "pending" ? "selected" : ""}>Pending</option>
            <option value="completed" ${status === "completed" ? "selected" : ""}>Completed</option>
            <option value="cancelled" ${status === "cancelled" ? "selected" : ""}>Cancelled</option>
        </select>
    `;
                    })()}
        </div>

        <div class="order-row">
            <span>
                <strong>
                    ${activeTab === "buy" ? "Seller Number" : "Buyer Number"}:
                </strong>
                <span>
                    ${activeTab === "buy"
                        ? (order.seller?.mobileNumber || "Not Set")
                        : (order.buyer?.mobileNumber || "Not Set")}
                </span>
            </span>
            <span>
                <strong>Discord:</strong>
                <span>
                    ${activeTab === "buy"
                        ? (order.seller?.discordTag || "Not Set")
                        : (order.buyer?.discordTag || "Not Set")}
                </span>
            </span>
        </div>
         <div class="order-row">
            <span>
                <strong>
                    Address:
                </strong>
                <span>
                    Little Seoul import store, Palomino Avenue, Little Seoul
                </span>
            </span>
        </div>
        `;

                container.appendChild(card);
            });
        }

        document.addEventListener("change", async (e) => {
            if (!e.target.classList.contains("status-dropdown")) return;

            const dropdown = e.target;
            const orderId = dropdown.dataset.id;
            const newStatus = dropdown.value;

            const previousStatus = dropdown.getAttribute("data-prev");

            if (dropdown.disabled) return;

            dropdown.disabled = true;

            try {
                showLoader();

                // Optimistic UI (already changed visually)

                const res = await fetch(`${API_BASE}/orders/${orderId}/status`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!res.ok) throw new Error();

                dropdown.setAttribute("data-prev", newStatus);

                dropdown.className = `status-dropdown ${newStatus}`;

            } catch (err) {
                console.error("Update failed:", err);

                dropdown.value = previousStatus;

                alert("Failed to update status");

            } finally {
                dropdown.disabled = false;
                hideLoader();
            }
        });
        /* ================= PAGINATION ================= */

        function renderPagination(pagination) {
            const paginationDiv = document.getElementById("pagination");
            paginationDiv.innerHTML = "";

            if (!pagination || pagination.totalPages <= 1) return;

            for (let i = 1; i <= pagination.totalPages; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;

                if (i === pagination.currentPage) {
                    btn.disabled = true;
                }

                btn.onclick = () => {
                    currentPage = i;
                    loadOrders(i);
                };

                paginationDiv.appendChild(btn);
            }
        }

        /* ================= LOAD CREDITS ================= */

        async function loadCredits(show = false) {
            if (show) showLoader();

            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();

                currentUser = user;
                document.getElementById("creditsDisplay").innerHTML = `<span style="color:#2ecc71">${user.credits ?? 0}</span>`;
                // ✅ Show site balance only for admins
                if (["superadmin"].includes(user.role)) {

                    document.getElementById("siteBalanceWrapper").style.display = "inline";

                    document.getElementById("siteBalanceDisplay").innerHTML =
                        `<span style="color:#4f8cff">${user.siteBalance ?? 0}</span>`;
                }
            } catch (err) {
                console.log("Failed to load credits", err);
            } finally {
                if (show) hideLoader();
            }
        }

        /* ================= INIT ================= */

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            loadOrders(currentPage);
            loadCredits(true);
            setInterval(() => loadCredits(false), 15000);
        }); 
    </script>

</body>

</html>
