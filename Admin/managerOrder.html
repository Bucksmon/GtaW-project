<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Seller Orders</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #151e33;
            --box: #1e2945;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --success: #2ecc71;
            --danger: #ff4f4f;

            --radius: 16px;
            --radius-sm: 12px;
            --transition: .25s ease;
        }

        /* ================= BASE ================= */

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, .06);
            padding: 30px 0;
            transition: transform var(--transition);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 8px 18px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, .08);
        }

        /* ================= OVERLAY ================= */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 250px;
            padding: 60px 40px;
            min-height: 100vh;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .topbar h2 {
            margin: 0;
            font-weight: 600;
        }

        .topbar span {
            color: var(--accent);
            font-weight: 600;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text);
            cursor: pointer;
        }

        /* ================= GRID ================= */

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* ================= CARD ================= */

        .service-card {
            background: var(--card);
            padding: 22px;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-6px);
        }

        .service-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--box);
        }

        .service-card h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .service-card p {
            margin: 0;
            font-size: .9rem;
            color: var(--muted);
        }

        .service-card strong {
            color: var(--text);
        }

        /* ================= ORDER STATUS COLORS ================= */

        .service-card p:last-child {
            font-weight: 600;
        }

        .service-card p:last-child:contains("completed"),
        .service-card p:last-child:contains("Completed") {
            color: var(--success);
        }

        /* ================= ORDER ROW ================= */

        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: .9rem;
            color: var(--muted);
        }

        .order-row span {
            white-space: nowrap;
        }

        /* subtle divider between rows */
        .order-row+.order-row {
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, .06);
        }

        /* ================= STATUS COLORS ================= */

        .order-status {
            font-weight: 600;
        }

        .order-status.completed {
            color: var(--success);
        }

        .order-status.pending {
            color: orange;
        }

        .order-status.failed {
            color: var(--danger);
        }

        /* ================= EMPTY STATE ================= */

        .services p {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 1rem;
        }

        /* ================= LOADER ================= */

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .loader-overlay.show {
            display: flex;
        }

        .popup {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, .2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width:768px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 30px 20px;
            }

            .menu-btn {
                display: block;
            }

        }

        /* ================= PAGINATION ================= */

        #pagination {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #pagination button {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, .08);
            background: var(--box);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
        }

        #pagination button:hover {
            background: var(--accent);
        }

        #pagination button:disabled {
            background: var(--accent);
            cursor: default;
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <h2>Admin Panel</h2>
        <ul class="nav-links" id="navLinks"></ul>
    </aside>

    <div class="overlay" id="overlay"></div>
    <!-- GLOBAL LOADER -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="popup">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
        </div>

        <div id="servicesContainer" class="services"></div>
        <div id="pagination"></div>
    </main>

    <script type="module">
        import { renderSidebar } from "../methods/sidebar.js";
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "../index.html";
        const loaderOverlay = document.getElementById("loaderOverlay");
        let currentPage = 1;
        const limit = 10;


        function showLoader() {
            loaderOverlay.classList.add("show");
        }

        function hideLoader() {
            loaderOverlay.classList.remove("show");
        }

        /* ================= SIDEBAR ================= */

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        /* ================= LOAD ORDERS ================= */

        async function loadAdminOrders(page = 1) {
            showLoader();

            try {
                const res = await fetch(
                    `${API_BASE}/orders/admin?page=${page}&limit=${limit}`,
                    {
                        headers: {
                            Authorization: `Bearer ${token}`
                        },
                        cache: "no-store"
                    }
                );

                if (!res.ok) throw new Error();

                const data = await res.json();

                renderOrders(data.orders || []);
                renderPagination(data.pagination);

            } catch (err) {
                console.error("Failed to load admin orders:", err);
            } finally {
                hideLoader();
            }
        }

        /* ================= RENDER ORDERS ================= */

        function renderOrders(orders) {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            if (!orders.length) {
                container.innerHTML = "<p>No orders yet.</p>";
                return;
            }

            orders.forEach(order => {
                const card = document.createElement("div");
                card.className = "service-card";

                card.innerHTML = `
        <img class="service-image"
            src="${order.service?.service_image || 'https://i.imgur.com/placeholder.png'}">
        
        <h3>${order.service?.service_title}</h3>

        <div class="order-row">
            <span><strong>Buyer:</strong> ${order.buyer?.username}</span>
            <span><strong>Total Price:</strong> <span style="color: green;">${order.totalPrice}</span></span>
        </div>

        <div class="order-row">
            <span><strong>You Received:</strong> ${order.sellerAmount} credits</span>
            <span class="order-status ${order.status?.toLowerCase()}">
                <strong>Status:</strong> ${order.status}
            </span>
        </div>
        `;

                container.appendChild(card);
            });
        }

        /* ================= PAGINATION ================= */

        function renderPagination(pagination) {
            const paginationDiv = document.getElementById("pagination");
            paginationDiv.innerHTML = "";

            if (!pagination || pagination.totalPages <= 1) return;

            for (let i = 1; i <= pagination.totalPages; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;

                if (i === pagination.currentPage) {
                    btn.disabled = true;
                }

                btn.onclick = () => {
                    currentPage = i;
                    loadAdminOrders(i);
                };

                paginationDiv.appendChild(btn);
            }
        }

        /* ================= LOAD CREDITS ================= */

        async function loadCredits(show = false) {
            if (show) showLoader();

            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();
                document.getElementById("creditsDisplay").innerHTML = `Credits: <span style="color:var(--accent)">${user.credits ?? 0}</span>`;
            } catch (err) {
                console.log("Failed to load credits", err);
            } finally {
                if (show) hideLoader();
            }
        }

        /* ================= INIT ================= */

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            loadAdminOrders(currentPage);
            loadCredits(true);
            setInterval(() => loadCredits(false), 15000);
        }); 
    </script>

</body>

</html>
