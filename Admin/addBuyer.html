<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Add Buyer</title>

    <!-- Use your SAME CSS (unchanged) -->
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        .nav-links li {
            margin: 6px 10px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(96, 96, 96, 0.432);
        }

        /* Main */
        .main {
            margin-left: 240px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        /* Content */
        .content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            max-width: 420px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        input {
            padding: 10px 14px;
            background: var(--box);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--text);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        button {
            margin-top: 10px;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .status {
            font-size: 0.9rem;
            margin-top: 6px;
        }

        /* Overlay (mobile) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .main {
                margin-left: 0;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-btn {
                display: block;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>Buyer Panel</h2>
        <ul class="nav-links">
            <li><a href="addBuyer.html">Add Buyer</a></li>
            <li><a href="addSeller.html">Add Buyer</a></li>
            <li><a href="removeSeller.html">Add Buyer</a></li>
            <li><a href="removeBuyer.html">Add Buyer</a></li>
            <li><a href="../index.html">Logout</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <span>Add Buyer</span>
        </div>

        <div class="content">
            <div class="card">
                <h2>Add Buyer</h2>

                <form id="buyerForm">
                    <label>Buyer Username</label>
                    <input id="username" placeholder="Firstname_Lastname" autocomplete="off" />

                    <div id="status" class="status"></div>
                    
                    <button id="submitBtn" type="submit" disabled>
                        Create Buyer
                    </button>

                </form>
            </div>
        </div>
    </main>

    <script>
        /* Sidebar toggle (same as your page) */
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        /* ===== REAL-TIME USERNAME VALIDATION ===== */

        const usernameInput = document.getElementById("username");
        const status = document.getElementById("status");
        const submitBtn = document.getElementById("submitBtn");

        usernameInput.addEventListener("input", () => {
            const value = usernameInput.value.trim();

            // Default state
            status.style.color = "red";
            submitBtn.disabled = true;

            if (!value) {
                status.textContent = "Username required.";
                return;
            }

            // ❌ No spaces allowed
            if (value.includes(" ")) {
                status.textContent = "No spaces allowed.";
                return;
            }

            // ❌ Only letters and underscore allowed
            if (!/^[A-Za-z_]+$/.test(value)) {
                status.textContent = "Only letters and one underscore allowed.";
                return;
            }

            // ❌ Must contain exactly ONE underscore
            const parts = value.split("_");

            if (parts.length !== 2) {
                status.textContent = "Must contain exactly one underscore.";
                return;
            }

            const [first, last] = parts;

            // ❌ First and last must exist
            if (!first || !last) {
                status.textContent = "Firstname and Lastname required.";
                return;
            }

            // ✅ Passed all checks
            status.style.color = "limegreen";
            status.textContent = "Valid username ✓";
            submitBtn.disabled = false;
        });

        /* Prevent submit if invalid (extra safety) */
        document.getElementById("buyerForm").addEventListener("submit", (e) => {
            if (submitBtn.disabled) {
                e.preventDefault();
            } else {
                alert("Buyer created successfully.");
            }
        });
    </script>

</body>

</html>
