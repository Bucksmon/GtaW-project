<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Panel - Manage Users</title>

<style>
:root {
    --bg: #0b0f1a;
    --panel: #111827;
    --card: #121a2a;
    --box: #1a2440;
    --text: #e6e9f2;
    --muted: #9aa4b8;
    --accent: #4f8cff;
    --shadow: rgba(0, 0, 0, 0.6);
}

* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    margin: 0;
    background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 240px;
    height: 100%;
    background: var(--panel);
    border-right: 1px solid rgba(255,255,255,0.08);
    padding-top: 20px;
    z-index: 1000;
    transform: translateX(0);
    transition: transform 0.3s ease;
}

.sidebar.open {
    transform: translateX(0);
}

@media (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
    }
}

.nav-links {
    list-style: none;
    padding: 0;
    margin: 0;
}

.nav-links li {
    margin: 6px 10px;
}

.nav-links a {
    display: block;
    padding: 12px 16px;
    color: white;
    text-decoration: none;
    border-radius: 10px;
}

.nav-links a:hover {
    background: rgba(96,96,96,0.432);
}

/* Sidebar Overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 900;
}

.overlay.active {
    display: block;
}

/* Main */
.main {
    margin-left: 240px;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

@media (max-width: 768px) {
    .main {
        margin-left: 0;
    }
}

.topbar {
    background: var(--card);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.menu-btn {
    font-size: 1.5rem;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: none;
}

@media (max-width: 768px) {
    .menu-btn {
        display: block;
    }
}

.credits-badge {
    background: var(--box);
    padding: 8px 14px;
    border-radius: 12px;
    font-weight: 600;
}

/* Content */
.content {
    padding: 25px;
    overflow-y: auto;
    flex: 1;
}

.card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

/* Loader */
.loader-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.loader-overlay.show {
    display: flex;
}

.popup {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">
    <h2 style="text-align:center;">Admin Panel</h2>
    <ul class="nav-links">
        <li><a href="admin.html">Add Buyer</a></li>
        <li><a href="addSeller.html">Add Seller</a></li>
        <li><a href="removeSeller.html">Remove Seller</a></li>
        <li><a href="removeBuyer.html">Remove Buyer</a></li>
        <li><a href="../index.html">Logout</a></li>
    </ul>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">
    <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h2>Manage Users</h2>
        <div class="credits-badge" id="creditsDisplay">Credits: 0</div>
    </div>

    <div class="content">
        <div id="usersContainer"></div>
    </div>
</main>

<div class="loader-overlay" id="loaderOverlay">
    <div class="popup">
        <div class="spinner"></div>
        <div>Loading...</div>
    </div>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const loaderOverlay = document.getElementById("loaderOverlay");
const menuBtn = document.getElementById("menuBtn");
const creditsDisplay = document.getElementById("creditsDisplay");

const API_BASE = "https://gtaw-project.vercel.app";
const token = localStorage.getItem("token");

if (!token) window.location.href = "../index.html";

/* Sidebar */
menuBtn.addEventListener("click", () => {
    sidebar.classList.toggle("open");
    overlay.classList.toggle("active");
});

overlay.addEventListener("click", () => {
    sidebar.classList.remove("open");
    overlay.classList.remove("active");
});

/* Loader */
function showLoader() {
    loaderOverlay.classList.add("show");
}
function hideLoader() {
    loaderOverlay.classList.remove("show");
}

/* Credits */
function loadCredits() {
    const credits = localStorage.getItem("credits") || 0;
    creditsDisplay.textContent = `Credits: ${credits}`;
}

/* Pagination */
let currentPage = 1;
let totalPages = 1;
const LIMIT = 5;

async function loadUsers(page = 1) {
    showLoader();
    try {
        const res = await fetch(`${API_BASE}/users?page=${page}&limit=${LIMIT}`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();

        currentPage = data.pagination.currentPage;
        totalPages = data.pagination.totalPages;

        renderUsers(data.users);
    } catch (err) {
        console.error(err);
    } finally {
        hideLoader();
    }
}

function renderUsers(users) {
    const container = document.getElementById("usersContainer");
    container.innerHTML = "";

    users.forEach(user => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <strong>${user.username}</strong><br>
            Role: ${user.role}<br>
            Credits: ${user.credits}
        `;
        container.appendChild(card);
    });
}

/* Init */
document.addEventListener("DOMContentLoaded", () => {
    showLoader();
    loadCredits();
    loadUsers();
});
</script>

</body>
</html>
