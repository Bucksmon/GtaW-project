<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin Panel - Manage Users</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        .nav-links li {
            margin: 6px 10px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(96, 96, 96, 0.432);
        }

        /* Main */
        .main {
            margin-left: 240px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        /* Content */
        .content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .user-row {
            background: var(--box);
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        select {
            margin-top: 8px;
            padding: 8px;
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .main {
                margin-left: 0;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-btn {
                display: block;
            }
        }

        /* Loading Popup */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loader-overlay.show {
            display: flex;
            opacity: 1;
        }

        .popup {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 10px 25px var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            width: 320px;
            justify-content: center;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Credits Badge */
        .credits-badge {
            background: var(--box);
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>Admin Panel</h2>
        <ul class="nav-links">
            <li><a href="admin.html">Add Buyer</a></li>
            <li><a href="addSeller.html">Add Seller</a></li>
            <li><a href="removeSeller.html">Remove Seller</a></li>
            <li><a href="removeBuyer.html">Remove Buyer</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Main -->
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Manage Users</h2>
        </div>

        <div class="content">
            <div id="usersContainer"></div>
        </div>

    </main>
    <!-- Loading Popup -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="popup">
            <div class="spinner"></div>
            <div>Loading...</div>
        </div>
    </div>
    <script>
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");
        const loaderOverlay = document.getElementById("loaderOverlay");
        const menuBtn = document.getElementById("menuBtn");
        const creditsDisplay = document.getElementById("creditsDisplay");

        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "../index.html";
        }

        /* ===============================
           CREDITS DISPLAY
        =============================== */
        function loadCredits() {
            const credits = localStorage.getItem("credits") || 0;
            creditsDisplay.textContent = `Credits: ${credits}`;
        }

        /* ===============================
           LOADER CONTROLS
        =============================== */
        function showLoader() {
            loaderOverlay.classList.add("show");
        }

        function hideLoader() {
            loaderOverlay.classList.remove("show");
        }

        /* ===============================
           SIDEBAR
        =============================== */
        if (menuBtn) {
            menuBtn.addEventListener("click", () => {
                sidebar.classList.toggle("open");
                sidebarOverlay.classList.toggle("active");
            });
        }

        sidebarOverlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("active");
        });

        /* ===============================
           PAGINATION
        =============================== */
        let currentPage = 1;
        let totalPages = 1;
        const LIMIT = 5;

        async function loadUsers(page = 1) {
            showLoader();

            try {
                const res = await fetch(`${API_BASE}/users?page=${page}&limit=${LIMIT}`, {
                    headers: { Authorization: `Bearer ${token}` },
                    cache: "no-store"
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || "Access denied");
                    hideLoader();
                    return;
                }

                currentPage = data.pagination.currentPage;
                totalPages = data.pagination.totalPages;

                renderUsers(data.users);
                renderPagination();

            } catch (err) {
                console.error("Load users error:", err);
            } finally {
                hideLoader();
            }
        }

        function renderUsers(users) {
            const container = document.getElementById("usersContainer");
            container.innerHTML = "";

            if (!Array.isArray(users) || users.length === 0) {
                container.innerHTML = "<div class='card'>No users found.</div>";
                return;
            }

            users.forEach(user => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                <div class="user-row">
                    <p><strong>${user.username}</strong></p>
                    <p>Role: ${user.role}</p>
                    <p>Credits: ${user.credits}</p>
                    <select onchange="updateRole('${user._id}', this.value)">
                        <option value="">Change Role</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            `;

                container.appendChild(card);
            });
        }

        function renderPagination() {
            const container = document.getElementById("usersContainer");

            const paginationDiv = document.createElement("div");
            paginationDiv.className = "card";
            paginationDiv.style.textAlign = "center";

            paginationDiv.innerHTML = `
            <button onclick="prevPage()" ${currentPage === 1 ? "disabled" : ""}>Previous</button>
            <span style="margin: 0 15px;">
                Page ${currentPage} of ${totalPages}
            </span>
            <button onclick="nextPage()" ${currentPage === totalPages ? "disabled" : ""}>Next</button>
        `;

            container.appendChild(paginationDiv);
        }

        function prevPage() {
            if (currentPage > 1) {
                loadUsers(currentPage - 1);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                loadUsers(currentPage + 1);
            }
        }

        async function updateRole(userId, role) {
            if (!role) return;
            if (!confirm(`Change role to ${role}?`)) return;

            showLoader();

            try {
                const res = await fetch(`${API_BASE}/users/role`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, role })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || "Failed to update role");
                    return;
                }

                alert("Role updated successfully");
                loadUsers(currentPage);

            } catch (err) {
                console.error("Role update error:", err);
            } finally {
                hideLoader();
            }
        }

        /* ===============================
           INIT
        =============================== */
        document.addEventListener("DOMContentLoaded", () => {
            showLoader();
            loadCredits();
            loadUsers();
        });
    </script>
</body>

</html>
