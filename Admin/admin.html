<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin Panel - Manage Uses</title>
    <link rel="icon" type="image/png" href="../Royal Road.png">
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #151e33;
            --box: #1e2945;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --success: #2ecc71;
            --danger: #ff4f4f;

            --radius: 16px;
            --radius-sm: 12px;
            --transition: .25s ease;
        }

        /* ================= BASE ================= */

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, .06);
            padding: 30px 0;
            transition: transform var(--transition);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* ================= SIDEBAR LOGO FIX ================= */

        .logo-title {
            display: flex;
            align-items: center;
            /* 🔥 vertical alignment */
            justify-content: center;
            /* keep centered like your current UI */
            gap: 10px;
            /* space between logo & text */

            margin-bottom: 30px;
        }

        /* override old rule */
        .sidebar h2.logo-title {
            text-align: center;
            /* keep consistency */
        }

        /* logo sizing */
        .logo-title img {
            height: 34px;
            width: 34px;
            object-fit: contain;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 8px 18px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, .08);
        }

        /* ================= OVERLAY ================= */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 250px;
            padding: 60px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .topbar h2 {
            margin: 0;
            font-weight: 600;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text);
            cursor: pointer;
        }

        .credits-badge {
            background: var(--box);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            color: var(--accent);
        }

        /* ================= CONTENT ================= */

        .content {
            flex: 1;
        }

        /* ================= USER CARD ================= */

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-details span {
            color: var(--muted);
            font-size: .9rem;
        }

        /* ================= DROPDOWN ================= */

        .role-select-wrapper {
            position: relative;
        }

        .role-select {
            padding: 10px 14px;
            width: 180px;
            background: var(--box);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: var(--radius-sm);
            font-size: .9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .role-select:hover {
            border-color: var(--accent);
        }

        /* ================= LOADER ================= */

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .loader-overlay.show {
            display: flex;
        }

        .popup {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, .2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width:768px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 30px 20px;
            }

            .menu-btn {
                display: block;
            }

            .user-info {
                flex-direction: column;
                align-items: stretch;
            }

            .role-select {
                width: 100%;
            }
        }

        /* ================= PAGINATION ================= */

        #pagination {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #pagination button {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, .08);
            background: var(--box);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
        }

        #pagination button:hover {
            background: var(--accent);
        }

        #pagination button:disabled {
            background: var(--accent);
            cursor: default;
        }

        .popup-btn {
            border: none;
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .popup-btn.primary {
            background: var(--accent);
            color: white;
        }

        .popup-btn.primary:hover {
            opacity: .9;
        }

        .popup-btn.secondary {
            background: rgba(255, 255, 255, .08);
            color: var(--text);
        }

        .popup-btn.secondary:hover {
            background: rgba(255, 255, 255, .12);
        }

        .popup-btn.danger {
            background: var(--danger);
            color: white;
        }

        .popup-btn.danger:hover {
            opacity: .9;
        }
    </style>
</head>

<body>
    <aside id="sidebar" class="sidebar">
        <h2>Royal Road</h2>
        <ul class="nav-links" id="navLinks"></ul>
    </aside>

    <div class="overlay"></div>

    <main class="main">
        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Manage Users</h2>
            <div class="credits-badge" id="creditsDisplay">
                Credits: <span id="creditsValue">0</span>
                <span id="siteBalanceWrapper" style="display:none; margin-left:10px;">
                    | Site: <span id="siteBalanceValue">0</span>
                </span>
            </div>
        </div>

        <div class="content">
            <div id="usersContainer"></div>
            <div id="pagination"></div>
        </div>
    </main>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="popup">
            <div class="spinner"></div>
            <div>Loading...</div>
        </div>
    </div>
    <div id="messagePopup" class="loader-overlay">

        <div class="popup" style="
      flex-direction: column;
      text-align: center;
      max-width: 420px;
      width: 90%;
    ">

            <span id="messagePopupTitle" style="
        font-weight: 700;
        font-size: 1.1rem;
      ">
                Notice
            </span>

            <span id="messagePopupText" style="
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 8px;
      ">
            </span>

            <div id="messagePopupButtons" style="
        display:flex;
        gap:10px;
        margin-top:20px;
        justify-content:center;
        flex-wrap:wrap;
      ">
            </div>

        </div>

    </div>
    <script type="module">
        import { renderSidebar } from "../methods/sidebar.js";
        const sidebar = document.getElementById("sidebar");
        const overlay = document.querySelector(".overlay");
        const menuBtn = document.getElementById("menuBtn");

        /* Mobile Sidebar Toggle */
        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        /* Close when clicking overlay */
        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });
        const loaderOverlay = document.getElementById("loaderOverlay");
        const creditsDisplay = document.getElementById("creditsDisplay");
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "../index.html";
        function parseJWT(token) {
            try {
                return JSON.parse(atob(token.split('.')[1]));
            } catch {
                return null;
            }
        }

        const currentUser = parseJWT(token);
        /* Logout */
        function logout() {
            localStorage.clear();
            window.location.href = "../index.html";
        }

        function showLoader() { loaderOverlay.classList.add("show"); }
        function hideLoader() { loaderOverlay.classList.remove("show"); }
        const messagePopup =
            document.getElementById("messagePopup");

        const messagePopupTitle =
            document.getElementById("messagePopupTitle");

        const messagePopupText =
            document.getElementById("messagePopupText");

        const messagePopupButtons =
            document.getElementById("messagePopupButtons");

        function closePopup() {
            messagePopup.classList.remove("show");
        }

        function showPopup({
            title = "Notice",
            message = "",
            buttons = []
        }) {

            messagePopupTitle.textContent = title;
            messagePopupText.textContent = message;

            messagePopupButtons.innerHTML = "";

            buttons.forEach(btn => {

                const button =
                    document.createElement("button");

                button.className =
                    `popup-btn ${btn.type || "primary"}`;

                button.textContent = btn.text;

                button.onclick = () => {

                    closePopup();

                    if (btn.onClick) {
                        btn.onClick();
                    }

                };

                messagePopupButtons.appendChild(button);

            });

            messagePopup.classList.add("show");

        }

        messagePopup.addEventListener("click", (e) => {

            if (e.target === messagePopup) {
                closePopup();
            }

        });
        function toggleCreditVisibility() {
            creditsDisplay.style.display = "block"; // always show
        }

        async function loadCredits() {
            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: {
                        Authorization: "Bearer " + token
                    }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();

                const creditsValue = document.getElementById("creditsValue");
                const siteBalanceWrapper = document.getElementById("siteBalanceWrapper");
                const siteBalanceValue = document.getElementById("siteBalanceValue");

                creditsValue.textContent = user.credits ?? 0;
                creditsValue.style.color = "#2ecc71";

                // reset
                siteBalanceWrapper.style.display = "none";

                if (user.role === "superadmin") {
                    siteBalanceWrapper.style.display = "inline";
                    siteBalanceValue.textContent = user.siteBalance ?? 0;
                    siteBalanceValue.style.color = "#4f8cff";
                }

            } catch (err) {
                console.log("Failed to load credits", err);
            }
        }
        let currentPage = 1;
        let totalPages = 1;
        const LIMIT = 5;

        async function loadUsers(page = 1) {
            showLoader();
            try {
                const res = await fetch(`${API_BASE}/users?page=${page}&limit=${LIMIT}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) return showPopup({
                    title: "Error",
                    message: data.error || "Something went wrong.",
                    buttons: [
                        {
                            text: "Close",
                            type: "primary"
                        }
                    ]
                });
                currentPage = data.pagination.currentPage;
                totalPages = data.pagination.totalPages;
                renderUsers(data.users);
                renderPagination();
            } finally { hideLoader(); }
        }

        const usersContainer = document.getElementById("usersContainer");
        const paginationContainer = document.getElementById("pagination");

        function renderUsers(users) {
            usersContainer.innerHTML = "";

            if (!users.length) {
                usersContainer.innerHTML = "<div class='card'>No users found.</div>";
                paginationContainer.innerHTML = "";
                return;
            }

            users.forEach(user => {
                const card = document.createElement("div");
                card.className = "card";

                const canEditRole =
                    currentUser?.role === "superadmin" || // full control
                    (currentUser?.role === "admin" && user.role !== "admin" && user.role !== "superadmin");

                card.innerHTML = `
            <div class="user-info">
                <div class="user-details">
                    <strong>${user.username}</strong>
                    <span>Nick Name: ${user.nickName ?? "Anonymous"}</span>
                    <span>Role: ${user.role}</span>
                    <span>Credits: ${user.credits ?? 0}</span>
                    <span>Mobile Number: ${user.mobileNumber ?? "Not Set"}</span>
                    <span>Discord Tag: ${user.discordTag ?? "Not Set"}</span>
                </div>
                ${canEditRole ? `
  <div class="role-select-wrapper">
    <select class="role-select" data-id="${user._id}">
      <option value="guest" ${user.role === "guest" ? "selected" : ""}>Guest</option>
      <option value="user" ${user.role === "user" ? "selected" : ""}>User</option>
      ${currentUser?.role === "superadmin" ? `
        <option value="admin" ${user.role === "admin" ? "selected" : ""}>Admin</option>
      ` : ""}
    </select>
  </div>
` : ""}
            </div>
        `;

                usersContainer.appendChild(card);
            });
        }

        function renderPagination() {
            paginationContainer.innerHTML = "";

            const prevBtn = document.createElement("button");
            prevBtn.textContent = "<";
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener("click", () => {
                if (currentPage > 1) loadUsers(currentPage - 1);
            });

            const pageInfo = document.createElement("span");
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;

            const nextBtn = document.createElement("button");
            nextBtn.textContent = ">";
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener("click", () => {
                if (currentPage < totalPages) loadUsers(currentPage + 1);
            });

            paginationContainer.append(prevBtn, pageInfo, nextBtn);
        }

        function prevPage() { if (currentPage > 1) loadUsers(currentPage - 1); }
        function nextPage() { if (currentPage < totalPages) loadUsers(currentPage + 1); }

        async function updateRole(userId, role) {

            if (!role) return;

            showPopup({
                title: "Change Role",
                message: `Are you sure you want to change this user's role to "${role}"?`,
                buttons: [

                    {
                        text: "Cancel",
                        type: "secondary"
                    },

                    {
                        text: "Confirm",
                        type: "primary",

                        onClick: async () => {

                            showLoader();

                            try {

                                const res = await fetch(`${API_BASE}/users/role`, {
                                    method: "PUT",
                                    headers: {
                                        "Content-Type": "application/json",
                                        Authorization: `Bearer ${token}`
                                    },
                                    body: JSON.stringify({
                                        userId,
                                        role
                                    })
                                });

                                const data = await res.json();

                                if (!res.ok) {

                                    showPopup({
                                        title: "Update Failed",
                                        message: data.error || "Failed to update role.",
                                        buttons: [
                                            {
                                                text: "Close",
                                                type: "primary"
                                            }
                                        ]
                                    });

                                    return;
                                }

                                await loadUsers(currentPage);

                                showPopup({
                                    title: "Success",
                                    message: "User role updated successfully.",
                                    buttons: [
                                        {
                                            text: "Great",
                                            type: "primary"
                                        }
                                    ]
                                });

                            } finally {

                                hideLoader();

                            }

                        }

                    }

                ]
            });

        }
        
        usersContainer.addEventListener("change", async (e) => {
            if (!e.target.classList.contains("role-select")) return;

            const userId = e.target.dataset.id;
            const role = e.target.value;

            if (!confirm(`Change role to ${role}?`)) {
                loadUsers(currentPage);
                return;
            }

            showLoader();

            try {
                const res = await fetch(`${API_BASE}/users/role`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, role })
                });

                const data = await res.json();
                if (!res.ok) return alert(data.error);
                loadUsers(currentPage);
            } finally {
                hideLoader();
            }
        });
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            loadUsers();
            toggleCreditVisibility();
            loadCredits();

            // optional realtime refresh
            setInterval(loadCredits, 15000);
        });
    </script>

</body>

</html>
