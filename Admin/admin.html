<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin Panel - Manage Users</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --danger: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 25px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        /* Desktop default */
        @media (min-width: 769px) {
            .sidebar {
                transform: translateX(0);
            }
        }

        /* Mobile hidden by default */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .menu-btn {
                display: block;
            }
        }

        /* Desktop layout spacing */
        @media (min-width: 769px) {
            .main {
                margin-left: 240px;
            }

            .menu-btn {
                display: none;
            }
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links li {
            margin: 8px 15px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            background: rgba(96, 96, 96, 0.4);
        }

        .nav-links a.active {
            background: var(--accent);
        }

        .logout-link {
            color: var(--danger);
        }

        /* Sidebar Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* Main */
        .main {
            margin-left: 240px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .credits-badge {
            background: var(--box);
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Content */
        .content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* User Layout */
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Loader */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loader-overlay.show {
            display: flex;
        }

        .popup {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Dropdown */
        .role-select-wrapper {
            position: relative;
            display: inline-block;
        }

        .role-select {
            padding: 10px 14px;
            width: 180px;
            background: linear-gradient(145deg, var(--box), #131c33);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            appearance: none;
        }

        .role-select option {
            background: var(--box);
            color: var(--text);
        }

        .role-select-wrapper::after {
            content: "▾";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--muted);
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul class="nav-links">
            <li><a href="admin-users.html" class="active">Manage Users</a></li>
            <li><a href="admin-services.html">Manage Services</a></li>
            <li><a href="#" class="logout-link" onclick="logout()">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay"></div>

    <main class="main">
        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Manage Users</h2>
            <div class="credits-badge" id="creditsDisplay">Credits: 0</div>
        </div>

        <div class="content">
            <div id="usersContainer"></div>
        </div>
    </main>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="popup">
            <div class="spinner"></div>
            <div>Loading...</div>
        </div>
    </div>

    <script>
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.querySelector(".overlay");
        const menuBtn = document.getElementById("menuBtn");

        /* Mobile Sidebar Toggle */
        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        /* Close when clicking overlay */
        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });
        const loaderOverlay = document.getElementById("loaderOverlay");
        const creditsDisplay = document.getElementById("creditsDisplay");

        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "../index.html";

        /* Logout */
        function logout() {
            localStorage.clear();
            window.location.href = "../index.html";
        }

        function showLoader() { loaderOverlay.classList.add("show"); }
        function hideLoader() { loaderOverlay.classList.remove("show"); }

        function loadCredits() {
            creditsDisplay.textContent = `Credits: ${localStorage.getItem("credits") || 0}`;
        }

        let currentPage = 1;
        let totalPages = 1;
        const LIMIT = 5;

        async function loadUsers(page = 1) {
            showLoader();
            try {
                const res = await fetch(`${API_BASE}/users?page=${page}&limit=${LIMIT}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error);
                currentPage = data.pagination.currentPage;
                totalPages = data.pagination.totalPages;
                renderUsers(data.users);
                renderPagination();
            } finally { hideLoader(); }
        }

        function renderUsers(users) {
            const container = document.getElementById("usersContainer");
            container.innerHTML = "";
            if (!users.length) {
                container.innerHTML = "<div class='card'>No users found.</div>";
                return;
            }

            users.forEach(user => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
        <div class="user-info">
            <div class="user-details">
                <strong>${user.username}</strong>
                <span>Role: ${user.role}</span>
                <span>Credits: ${user.credits}</span>
            </div>
            <div class="role-select-wrapper">
                <select class="role-select" onchange="updateRole('${user._id}', this.value)">
                    <option value="">Change Role</option>
                    <option value="buyer" ${user.role === "buyer" ? "selected" : ""}>Buyer</option>
                    <option value="seller" ${user.role === "seller" ? "selected" : ""}>Seller</option>
                    <option value="admin" ${user.role === "admin" ? "selected" : ""}>Admin</option>
                </select>
            </div>
        </div>
        `;
                container.appendChild(card);
            });
        }

        function renderPagination() {
            const container = document.getElementById("usersContainer");
            const card = document.createElement("div");
            card.className = "card";
            card.style.textAlign = "center";
            card.innerHTML = `
        <button onclick="prevPage()" ${currentPage === 1 ? "disabled" : ""}>Previous</button>
        <span style="margin:0 15px;">Page ${currentPage} of ${totalPages}</span>
        <button onclick="nextPage()" ${currentPage === totalPages ? "disabled" : ""}>Next</button>
    `;
            container.appendChild(card);
        }

        function prevPage() { if (currentPage > 1) loadUsers(currentPage - 1); }
        function nextPage() { if (currentPage < totalPages) loadUsers(currentPage + 1); }

        async function updateRole(userId, role) {
            if (!role) return;
            if (!confirm(`Change role to ${role}?`)) return;
            showLoader();
            try {
                const res = await fetch(`${API_BASE}/users/role`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, role })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error);
                alert("Role updated successfully");
                loadUsers(currentPage);
            } finally { hideLoader(); }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadCredits();
            loadUsers();
        });
    </script>

</body>

</html>
