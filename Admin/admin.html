<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin Panel - Manage Users</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        .nav-links li {
            margin: 6px 10px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(96, 96, 96, 0.432);
        }

        /* Main */
        .main {
            margin-left: 240px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        /* Content */
        .content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .user-row {
            background: var(--box);
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        select {
            margin-top: 8px;
            padding: 8px;
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .main {
                margin-left: 0;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-btn {
                display: block;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>Admin Panel</h2>
        <ul class="nav-links">
            <li><a href="admin.html">Add Buyer</a></li>
            <li><a href="addSeller.html">Add Seller</a></li>
            <li><a href="removeSeller.html">Remove Seller</a></li>
            <li><a href="removeBuyer.html">Remove Buyer</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Main -->
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Manage Users</h2>
        </div>

        <div class="content">
            <div id="usersContainer"></div>
        </div>

    </main>

    <script>
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        // Sidebar toggle
        if (menuBtn) {
            menuBtn.addEventListener("click", () => {
                sidebar.classList.toggle("open");
                overlay.classList.toggle("active");
            });
        }

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        // Active link logic
        const currentPage = window.location.pathname.split("/").pop();
        document.querySelectorAll(".nav-links a").forEach(link => {
            if (link.getAttribute("href") === currentPage) {
                link.classList.add("active");
            }
        });

        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "../index.html";
        }

        /*
        ====================================================
        Load Users
        ====================================================
        */
        async function loadUsers() {
            console.log("Loading users...");

            try {
                const res = await fetch(`${API_BASE}/users`, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    },
                    cache: "no-store"
                });

                console.log("Users response status:", res.status);

                const data = await res.json();
                console.log("Users response data:", data);

                if (!res.ok) {
                    alert(data.error || "Access denied");
                    return;
                }

                renderUsers(data);

            } catch (err) {
                console.error("Load users error:", err);
            }
        }

        /*
        ====================================================
        Render Users
        ====================================================
        */
        function renderUsers(users) {
            const container = document.getElementById("usersContainer");
            container.innerHTML = "";

            if (!Array.isArray(users) || users.length === 0) {
                container.innerHTML = "<div class='card'>No users found.</div>";
                return;
            }

            users.forEach(user => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="user-row">
                        <p><strong>${user.username}</strong></p>
                        <p>Role: ${user.role}</p>
                        <p>Credits: ${user.credits}</p>
                        <select onchange="updateRole('${user._id}', this.value)">
                            <option value="">Change Role</option>
                            <option value="buyer">Buyer</option>
                            <option value="seller">Seller</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        /*
        ====================================================
        Update Role
        ====================================================
        */
        async function updateRole(userId, role) {
            if (!role) return;

            if (!confirm(`Change role to ${role}?`)) return;

            try {
                const res = await fetch(`${API_BASE}/users/role`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, role })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || "Failed to update role");
                    return;
                }

                alert("Role updated successfully");
                loadUsers();

            } catch (err) {
                console.error("Role update error:", err);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadUsers();
        });
    </script>

</body>

</html>
