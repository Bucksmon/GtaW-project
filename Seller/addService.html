<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Seller Panel – Sell Credits</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        .nav-links li {
            margin: 6px 10px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(96, 96, 96, 0.432);
        }

        /* Main */
        .main {
            margin-left: 240px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        /* Content */
        .content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .content h1 {
            margin-bottom: 20px;
            font-size: 1.6rem;
        }

        /* Add Button */
        #addServiceBtn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform .15s ease;
        }

        #addServiceBtn:hover {
            transform: translateY(-2px);
        }

        /* Service Grid */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease;
        }

        .service-card:hover {
            transform: translateY(-4px);
        }

        .service-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .service-card h3 {
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .service-card p {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .service-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .price {
            color: var(--accent);
        }

        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #ef4444;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            padding: 20px;
            border-radius: 14px;
            width: 90%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-content h2 {
            margin-bottom: 15px;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--box);
            color: var(--text);
        }

        .save-btn,
        .cancel-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn {
            background: #10b981;
            color: white;
            margin-right: 10px;
        }

        .cancel-btn {
            background: #ef4444;
            color: white;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main {
                margin-left: 0;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-btn {
                display: block;
            }

            #addServiceBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>Seller Panel</h2>
        <ul class="nav-links">
            <li><a href="seller.html">Browse Services</a></li>
            <li><a href="sellerOrder.html">Orders</a></li>
            <li><a href="sellCredits.html">Sell Credits</a></li>
            <li><a class="active" href="addService.html">Add Services</a></li>
            <li><a href="removeService.html">Remove Services</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <span>Sell Credits</span>
        </div>

        <div class="content">
            <h1>My Services</h1>
            <button id="addServiceBtn">+ Add New Service</button>
            <div class="services" id="serviceList"></div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <h2>Add New Service</h2>
            <input type="text" id="serviceName" placeholder="Service Name" required />
            <textarea id="serviceDesc" placeholder="Description" rows="3" required></textarea>
            <input type="number" id="servicePrice" placeholder="Price ($)" required />

            <div style="text-align:right;">
                <button class="save-btn" id="saveService">Save</button>
                <button class="cancel-btn" id="cancelService">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const addBtn = document.getElementById("addServiceBtn");
        const modal = document.getElementById("serviceModal");
        const cancelBtn = document.getElementById("cancelService");
        const saveBtn = document.getElementById("saveService");
        const serviceList = document.getElementById("serviceList");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        addBtn.addEventListener("click", () => modal.classList.add("active"));
        cancelBtn.addEventListener("click", () => modal.classList.remove("active"));

        saveBtn.addEventListener("click", async () => {
            const name = serviceName.value.trim();
            const desc = serviceDesc.value.trim();
            const price = servicePrice.value.trim();

            if (!name || !desc || !price) {
                alert("Fill all fields");
                return;
            }

            const payload = {
                service_title: name,
                service_description: desc,
                service_price: Number(price),
                service_sellerId: "john_doe" // TODO: replace with logged-in user
            };

            try {
                const res = await fetch("https://your-api.com/services", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Failed to save service");

                const data = await res.json();
                console.log("Saved:", data);

                // ✅ Only add card to UI if backend save succeeded
                const card = document.createElement("div");
                card.className = "service-card";
                card.innerHTML = `
      <img src="https://via.placeholder.com/300x150">
      <h3>${name}</h3>
      <p>${desc}</p>
      <div class="service-meta">
        <span class="price">$${price}</span>
        <button class="delete-btn">🗑️</button>
      </div>
    `;

                card.querySelector(".delete-btn").onclick = () => card.remove();
                serviceList.appendChild(card);

                // reset form
                serviceName.value = "";
                serviceDesc.value = "";
                servicePrice.value = "";

                modal.classList.remove("active");

            } catch (err) {
                console.error(err);
                alert("Failed to save service to server.");
            }
        });
    </script>

</body>

</html>
