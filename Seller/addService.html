<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Seller Panel - Add Service</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --danger: #ff4f4f;

      --radius: 16px;
      --radius-sm: 12px;
      --transition: .25s ease;
    }

    /* ================= BASE ================= */

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    /* ================= OVERLAY ================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 250px;
      padding: 60px 40px;
      min-height: 100vh;
    }

    /* ================= TOPBAR ================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
    }

    .topbar h2 {
      margin: 0;
      font-weight: 600;
    }

    .topbar h3 {
      margin: 0;
      font-weight: 500;
      color: var(--muted);
    }

    .topbar span {
      color: var(--accent);
      font-weight: 600;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.6rem;
      cursor: pointer;
    }

    /* ================= FORM CARD ================= */

    .form-card {
      background: var(--card);
      padding: 36px;
      border-radius: var(--radius);
      max-width: 650px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
    }

    /* ================= FORM GROUP ================= */

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .form-group label {
      font-size: .9rem;
      color: var(--muted);
    }

    .form-group input,
    .form-group textarea {
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, .08);
      background: var(--box);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(79, 140, 255, .25);
    }

    /* ================= HELPER TEXT ================= */

    .helper-text {
      font-size: .8rem;
      color: var(--muted);
    }

    /* ================= IMAGE PREVIEW ================= */

    .image-preview {
      margin-top: 12px;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, .08);
      display: none;
    }

    /* ================= BUTTON ================= */

    .submit-btn {
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .submit-btn:hover {
      opacity: .9;
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* ================= GLOBAL LOADER ================= */

    .global-loader {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .loader-box {
      background: var(--card);
      padding: 40px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    .spinner-large {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, .2);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      margin: auto;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }

    }
  </style>
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <h2 style="text-align:center;">Seller Panel</h2>
    <ul class="nav-links">
      <li><a href="seller.html">Browse Services</a></li>
      <li><a href="sellerOrder.html">Orders</a></li>
      <li><a href="sellCredits.html">Sell Credits</a></li>
      <li><a class="active" href="addService.html">Add Services</a></li>
      <li><a href="removeService.html">Remove Services</a></li>
      <li><a href="../index.html">Logout</a></li>
    </ul>
  </aside>

  <div class="overlay" id="overlay"></div>
  <!-- GLOBAL LOADER -->
  <div id="globalLoader" class="global-loader">
    <div class="loader-box">
      <div class="spinner-large"></div>
      <p>Adding service...</p>
    </div>
  </div>
  <main class="main">

    <div class="topbar">
      <div style="display:flex; align-items:center; gap:15px;">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h2>Add Service</h2>
      </div>

      <h3>Your Credits: <span id="creditsDisplay">0</span></h3>
    </div>

    <div class="form-card">

      <div class="form-group">
        <label>Service Title</label>
        <input type="text" id="title">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description"></textarea>
      </div>

      <div class="form-group">
        <label>Price (credits)</label>
        <input type="number" id="price">
      </div>

      <div class="form-group">
        <label>Service Image (Imgur Link)</label>
        <input type="text" id="imageInput" placeholder="https://i.imgur.com/example.png">
        <div class="helper-text">
          Example: https://i.imgur.com/placeholder.png
        </div>
        <img id="preview" class="image-preview">
      </div>

      <button class="submit-btn" onclick="submitService()">Add Service</button>



    </div>
  </main>

  <script>
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "../index.html";
    }

    /* ================= Sidebar ================= */
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    /* ================= Form ================= */

    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const priceInput = document.getElementById("price");
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const loader = document.getElementById("loader");

    /* Live Image Preview */
    imageInput.addEventListener("input", () => {
      const url = imageInput.value.trim();

      if (url !== "") {
        preview.src = url;
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }
    });

    /* ================= Submit ================= */

    const globalLoader = document.getElementById("globalLoader");
    const submitBtn = document.querySelector(".submit-btn");

    async function submitService() {
      const service_title = titleInput.value.trim();
      const service_description = descriptionInput.value.trim();
      const service_price = Number(priceInput.value);
      const service_image = imageInput.value.trim();

      if (!service_title || !service_description || !service_price) {
        alert("Please fill all required fields.");
        return;
      }

      submitBtn.disabled = true;
      globalLoader.style.display = "flex";

      try {
        const res = await fetch(`${API_BASE}/services`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            service_title,
            service_description,
            service_price,
            service_image
          })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Failed to add service");
          return;
        }

        alert("Service added successfully!");

        titleInput.value = "";
        descriptionInput.value = "";
        priceInput.value = "";
        imageInput.value = "";
        preview.style.display = "none";

      } catch (err) {
        console.error("Add service error:", err);
        alert("Server error");
      } finally {
        submitBtn.disabled = false;
        globalLoader.style.display = "none";
      }
    }

    async function loadCredits() {
      try {
        const res = await fetch(`${API_BASE}/users/me`, {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        if (!res.ok) throw new Error();

        const user = await res.json();
        document.getElementById("creditsDisplay").textContent =
          user.credits ?? 0;

      } catch (err) {
        console.log("Failed to load credits", err);
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      loadCredits();
    });
  </script>

</body>

</html>
