<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Services</title>
  <link rel="icon" type="image/png" href="../Royal Road.png">

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --danger: #ff4f4f;

      --radius: 16px;
      --radius-sm: 12px;
      --transition: .25s ease;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* ================= SIDEBAR LOGO FIX ================= */

    .logo-title {
      display: flex;
      align-items: center;
      /* 🔥 vertical alignment */
      justify-content: center;
      /* keep centered like your current UI */
      gap: 10px;
      /* space between logo & text */

      margin-bottom: 30px;
    }

    /* override old rule */
    .sidebar h2.logo-title {
      text-align: center;
      /* keep consistency */
    }

    /* logo sizing */
    .logo-title img {
      height: 34px;
      width: 34px;
      object-fit: contain;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* MAIN */

    .main {
      margin-left: 250px;
      padding: 40px 40px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* TABS */

    .tabs {
      display: flex;
      justify-content: center;
      /* centers tabs horizontally */
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 18px;
      min-width: 140px;
      /* gives consistent size */
      background: var(--box);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .tab.active {
      background: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ✅ ADD FIX */

    .add-wrapper {
      display: flex;
      justify-content: center;
    }

    .form-card {
      background: var(--card);
      padding: 32px;
      border-radius: var(--radius);
      max-width: 520px;
      /* reduced from 650px */
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .form-group input,
    .form-group textarea {
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, .08);
      background: var(--box);
      color: var(--text);
    }

    textarea {
      min-height: 30px;
      /* was 120px */
      resize: vertical;
    }

    .submit-btn {
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;

      display: block;
      margin-left: auto;
      margin-right: auto;
      /* centers button */
      min-width: 180px;
      /* makes it feel consistent */
    }

    /* SERVICES */

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
      gap: 30px;
    }


    .service-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }

    .service-meta {
      display: flex;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, .06);
    }

    .danger-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    #pagination {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #pagination button {
      padding: 8px 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--box);
      color: var(--text);
      cursor: pointer;
    }

    #pagination button:disabled {
      opacity: .5;
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .loader-overlay.show {
      display: flex;
    }

    .popup {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, .2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width:768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }
    }

    /* ================= POPUP BUTTONS ================= */

    .popup-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      min-width: 120px;
    }

    .popup-btn.primary {
      background: var(--accent);
      color: white;
    }

    .popup-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(79, 140, 255, 0.3);
    }

    .popup-btn.secondary {
      background: var(--box);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .popup-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .popup-btn:active {
      transform: scale(0.96);
    }

    /* ================= PROFILE POPUP ONLY ================= */

    #profilePopup .popup {
      width: 90%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
    }

    #profilePopup .popup span {
      white-space: normal;
      word-break: break-word;
    }

    #profilePopup .popup>div {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 500px) {
      #profilePopup .popup {
        max-width: 300px;
        padding: 18px;
      }

      #profilePopup .popup>div {
        flex-direction: column;
        align-items: center;
      }

      #profilePopup .popup-btn {
        width: 100%;
        max-width: 220px;
      }
    }

    /* ================= FIX OVERFLOW + STRUCTURE ================= */

    /* ================= CARD ================= */

    .service-card {
      background: var(--card);

      border-radius: var(--radius);

      padding: 22px;

      display: flex;
      flex-direction: column;

      gap: 14px;

      box-shadow: 0 20px 55px rgba(0, 0, 0, .4);

      transition: var(--transition);

      position: relative;

      overflow: hidden;

      align-self: start;
    }

    .service-card:hover {
      transform: translateY(-6px);
    }

    /* ================= IMAGE ================= */

    .service-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--box);
      flex-shrink: 0;
    }

    /* ================= TITLE ================= */

    .service-card h3 {
      margin: 0;
      font-size: 1.1rem;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ================= DESCRIPTION ================= */

    .service-card p {
      margin: 0;
      font-size: .9rem;
      color: var(--muted);

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .service-card strong {
      color: var(--text);
    }

    /* ================= META ROW ================= */

    .service-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, .06);
      margin-top: 4px;
    }

    .service-meta span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 48%;
    }

    /* ================= BUTTON ================= */

    .service-card button {
      margin-top: auto;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .service-card button:hover {
      opacity: .9;
    }

    .service-card button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .service-actions {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 14px;

      padding-top: 12px;

      border-top:
        1px solid rgba(255, 255, 255, .06);
    }

    .update-btn {
      margin-left: auto;
    }

    .service-actions .update-btn {
      margin-left: auto;
      margin-right: 0;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;

      background: rgba(255, 255, 255, .04);

      padding: 8px 12px;

      border-radius: 12px;
    }

    .quantity-box label {
      font-size: .9rem;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .quantity-box input {
      width: 75px;

      padding: 10px;

      border: none;
      outline: none;

      border-radius: 10px;

      background: var(--box);

      color: white;

      text-align: center;

      font-weight: 600;
    }

    .update-btn {
      min-width: 160px;
    }

    .delete-btn {
      background: var(--danger);
    }

    .services p {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ================= ORDER-STYLE ROW (MISSING) ================= */

    .order-row {
      display: flex;
      justify-content: center;
      /* 🔥 center instead of space-between */
      align-items: center;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);

      max-width: 90%;
      margin: 0 auto;
    }

    .order-row span {
      white-space: normal;
      /* 🔥 allow wrapping */
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    /* spacing like orders */
    .order-row+.order-row {
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, .06);
    }

    .delete-btn {
      margin-left: auto;
    }

    .quantity-box input::-webkit-outer-spin-button,
    .quantity-box input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .quantity-box input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <h2>Royal Road</h2>
    <ul class="nav-links" id="navLinks"></ul>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div id="loaderOverlay" class="loader-overlay">
    <div class="popup">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <div id="profilePopup" class="loader-overlay">
    <div class="popup" style="flex-direction: column; text-align: center;">
      <span style="font-weight: 600;">Complete Your Profile</span>
      <span style="font-size: 0.9rem; color: var(--muted);">
        Please set your Mobile Number and Discord Tag before adding a service.
      </span>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="goSettingsBtn" class="popup-btn primary">Go to Settings</button>
        <button id="closePopupBtn" class="popup-btn secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="messagePopup" class="loader-overlay">

    <div class="popup" style="
      flex-direction: column;
      text-align: center;
      max-width: 420px;
      width: 90%;
    ">

      <span id="messagePopupTitle" style="
        font-weight: 700;
        font-size: 1.1rem;
      ">
        Notice
      </span>

      <span id="messagePopupText" style="
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 8px;
      ">
      </span>

      <div id="messagePopupButtons" style="
        display:flex;
        gap:10px;
        margin-top:20px;
        justify-content:center;
        flex-wrap:wrap;
      ">
      </div>

    </div>

  </div>
  <main class="main">

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:15px;">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h2>Credits: <span id="creditsDisplay">0</span></h2>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="add">Add Service</button>
      <button class="tab" data-tab="remove">Remove Services</button>
    </div>

    <!-- ADD -->
    <div id="add" class="tab-content active">
      <div class="add-wrapper">
        <div class="form-card">
          <div class="form-group">
            <label>Service Title</label>
            <input id="title">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="description"></textarea>
          </div>
          <div class="form-group">
            <label>Address:(Not changeable)</label>
            <p style="margin:0; color: var(--muted);">
              Little Seoul import store, Palomino Avenue, Little Seoul
            </p>
          </div>
          <div class="form-group">
            <label>Price</label>
            <input id="price" type="number" min="1" step="1" inputmode="numeric" pattern="[0-9]*" />

          </div>

          <div class="form-group">
            <label>Service Type</label>

            <select id="serviceType" style="
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,.08);
    background: var(--box);
    color: var(--text);
  ">
              <option value="repeat">Repeatable</option>
              <option value="quantity">Quantifiable</option>
            </select>
          </div>

          <div class="form-group" id="quantityWrapper" style="display:none;">
            <label>Quantity</label>

            <input id="quantityInput" type="number" min="1" value="0" />
          </div>

          <div class="form-group">
            <label>Image URL</label>
            <input id="imageInput" placeholder="https://i.imgur.com/bua2dNG.png">
            <small style="color: var(--muted); font-size: 0.75rem;">
              Example: https://i.imgur.com/bua2dNG.png
            </small>
            <img id="preview" style="display:none;width:100%;margin-top:10px;border-radius:10px;">
          </div>
          <button class="submit-btn">Add Service</button>
        </div>
      </div>
    </div>

    <!-- REMOVE -->
    <div id="remove" class="tab-content">
      <div id="servicesContainer" class="services"></div>
      <div id="pagination"></div>
    </div>

  </main>

  <script type="module">
    import { renderSidebar } from "../methods/sidebar.js";

    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) location.href = "../index.html";

    const loaderOverlay = document.getElementById("loaderOverlay");

    function showLoader() { loaderOverlay.classList.add("show"); }
    function hideLoader() { loaderOverlay.classList.remove("show"); }

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");
    let currentUser = null;

    const profilePopup = document.getElementById("profilePopup");

    function showProfilePopup() {
      profilePopup.classList.add("show");
    }

    function hideProfilePopup() {
      profilePopup.classList.remove("show");
    }
    const messagePopup = document.getElementById("messagePopup");
    const messagePopupTitle = document.getElementById("messagePopupTitle");
    const messagePopupText = document.getElementById("messagePopupText");
    const messagePopupButtons = document.getElementById("messagePopupButtons");

    function closeMessagePopup() {
      messagePopup.classList.remove("show");
    }

    function showPopup({
      title = "Notice",
      message = "",
      buttons = []
    }) {

      messagePopupTitle.textContent = title;
      messagePopupText.textContent = message;

      messagePopupButtons.innerHTML = "";

      buttons.forEach(btn => {

        const button = document.createElement("button");

        button.className =
          `popup-btn ${btn.type || "primary"}`;

        button.textContent = btn.text;

        button.onclick = () => {

          closeMessagePopup();

          if (btn.onClick) {
            btn.onClick();
          }

        };

        messagePopupButtons.appendChild(button);

      });

      messagePopup.classList.add("show");

    }
    document.getElementById("closePopupBtn").onclick = hideProfilePopup;

    document.getElementById("goSettingsBtn").onclick = () => {
      window.location.href = "../Settings.html";
    };

    // click outside to close
    profilePopup.addEventListener("click", (e) => {
      if (e.target === profilePopup) hideProfilePopup();
    });
    messagePopup.addEventListener("click", (e) => {

      if (e.target === messagePopup) {
        closeMessagePopup();
      }

    });
    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    const tabs = document.querySelectorAll(".tab");

    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        document.getElementById(tab.dataset.tab).classList.add("active");

        if (tab.dataset.tab === "remove") loadServices();
      };
    });

    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const priceInput = document.getElementById("price");
    const imageInput = document.getElementById("imageInput");
    const serviceTypeInput = document.getElementById("serviceType");
    const quantityInput = document.getElementById("quantityInput");
    const quantityWrapper = document.getElementById("quantityWrapper");
    const preview = document.getElementById("preview");

    imageInput.oninput = () => {
      const url = imageInput.value.trim();
      preview.style.display = url ? "block" : "none";
      preview.src = url;
    };

    serviceTypeInput.addEventListener("change", () => {

      if (serviceTypeInput.value === "quantity") {
        quantityWrapper.style.display = "flex";
      } else {
        quantityWrapper.style.display = "none";
        quantityInput.value = 0;
      }

    });

    document.querySelector(".submit-btn").onclick = async () => {

      const isMissing =
        !currentUser?.mobileNumber?.trim() ||
        !currentUser?.discordTag?.trim();

      if (isMissing) {
        showProfilePopup();
        return;
      }

      const service_title = titleInput.value.trim();
      const service_description = descriptionInput.value.trim();
      const service_price = Number(priceInput.value);
      const service_image = imageInput.value.trim();
      const service_type = serviceTypeInput.value;
      const quantity = Number(quantityInput.value);
      if (!service_title || !service_description || !service_price) {
        showPopup({
          title: "Missing Information",
          message: "Please complete all required service fields.",
          buttons: [
            {
              text: "Okay",
              type: "primary"
            }
          ]
        });
        return;
      }

      if (service_price < 1) {
        priceInput.value = 1;
        return;
      }

      if (service_type === "quantity" && quantity < 1) {
        quantityInput.value = 1;
        return;
      }
      showLoader();

      try {
        const res = await fetch(`${API_BASE}/services`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            service_title,
            service_description,
            service_price,
            service_image,
            service_type,
            quantity
          })
        });

        const data = await res.json();

        if (!res.ok) return alert(data.error || "Failed");

        titleInput.value = "";
        descriptionInput.value = "";
        priceInput.value = "";
        imageInput.value = "";
        quantityInput.value = 0;
        quantityWrapper.style.display = "none";
        serviceTypeInput.value = "repeat";
        preview.style.display = "none";

      } catch (err) {
        console.error(err);
      }

      hideLoader();
    };

    let currentPage = 1;

    async function loadServices(page = 1) {
      showLoader();

      const res = await fetch(`${API_BASE}/services/mine?page=${page}&limit=8`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const data = await res.json();

      renderServices(data.services || []);
      renderPagination(data.page || 1, data.totalPages || 1);

      hideLoader();
    }

    function renderServices(services) {

      const container =
        document.getElementById("servicesContainer");

      container.innerHTML = "";

      if (!services.length) {

        container.innerHTML =
          "<p>No services found.</p>";

        return;

      }

      services.forEach(service => {

        const card =
          document.createElement("div");

        card.className = "service-card";

        card.innerHTML = `

<img
  class="service-image"
  src="${service.service_image || 'https://i.imgur.com/placeholder.png'}"
>

<h3>
  ${service.service_title}
</h3>

<p>
  ${service.service_description}
</p>

<div class="service-meta">

  <span>
    <strong>💰 Price:</strong>

    <span style="color:#2ecc71">
      ${service.service_price || 0}
    </span>
  </span>

  <span>
    <strong>🧩 Type:</strong>

    ${service.service_type}
  </span>

</div>

${service.service_type === "quantity" ? `

<div class="service-meta">

  <span>
    <strong>📦 Stock:</strong>

    <span style="
      color:${service.quantity > 0
              ? '#2ecc71'
              : '#ff4f4f'}
    ">
      ${service.quantity || 0}
    </span>
  </span>

</div>

<div class="service-actions">

  <div class="quantity-box">

    <label>
      📦 Qty
    </label>

    <input
      type="number"
      min="1"
      value="${service.quantity || 1}"
      id="qty-${service._id}"
    />

  </div>

  <button
    class="submit-btn update-btn"
    onclick="updateQuantity('${service._id}')"
  >
    Update
  </button>

</div>

` : ""}

<div class="service-actions" style="margin-top:0;">

  <div style="flex:1;"></div>

  <button
    class="danger-btn delete-btn"
    onclick="deleteService('${service._id}')"
  >
    🗑 Delete
  </button>

</div>

`;

        container.appendChild(card);

      });

    }

    async function deleteService(id) {

      showPopup({
        title: "Delete Service",
        message: "Are you sure you want to permanently delete this service?",
        buttons: [

          {
            text: "Cancel",
            type: "secondary"
          },

          {
            text: "Delete",
            type: "primary",

            onClick: async () => {

              showLoader();

              try {

                const res = await fetch(`${API_BASE}/services/${id}`, {
                  method: "DELETE",
                  headers: {
                    Authorization: `Bearer ${token}`
                  }
                });

                const data = await res.json();

                if (!res.ok) {

                  showPopup({
                    title: "Delete Failed",
                    message: data.error || "Failed to delete service.",
                    buttons: [
                      {
                        text: "Close",
                        type: "primary"
                      }
                    ]
                  });

                  return;
                }

                loadServices(currentPage);

                showPopup({
                  title: "Service Deleted",
                  message: "Your service has been removed successfully.",
                  buttons: [
                    {
                      text: "Okay",
                      type: "primary"
                    }
                  ]
                });

              } catch (err) {

                console.error(err);

                showPopup({
                  title: "Server Error",
                  message: "Something went wrong while deleting.",
                  buttons: [
                    {
                      text: "Close",
                      type: "primary"
                    }
                  ]
                });

              }

              hideLoader();

            }

          }

        ]
      });

    }

    window.updateQuantity = async function (id) {

      const input = document.getElementById(`qty-${id}`);

      const quantity = Number(input.value);

      if (!input.value || quantity < 1) {
        showPopup({
          title: "Invalid Quantity",
          message: "Quantity must be at least 1.",
          buttons: [
            {
              text: "Okay",
              type: "primary"
            }
          ]
        });
        return;
      }

      showLoader();

      try {

        const res = await fetch(`${API_BASE}/services/${id}/quantity`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            quantity
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showPopup({
            title: "Request Failed",
            message: data.error || "Something went wrong.",
            buttons: [
              {
                text: "Close",
                type: "primary"
              }
            ]
          });
          return;
        }
        input.value = quantity;
        await loadServices(currentPage);
        showPopup({
          title: "Success",
          message: "Service quantity updated successfully.",
          buttons: [
            {
              text: "Great",
              type: "primary"
            }
          ]
        });

      } catch (err) {
        console.error(err);
      }

      hideLoader();
    }

    function renderPagination(current, total) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";

      for (let i = 1; i <= total; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;

        if (i === current) btn.disabled = true;

        btn.onclick = () => {
          currentPage = i;
          loadServices(i);
        };

        pagination.appendChild(btn);
      }
    }

    async function loadCredits() {
      const res = await fetch(`${API_BASE}/users/me`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const user = await res.json();
      currentUser = user;
      document.getElementById("creditsDisplay").innerHTML =
        `<span style="color:#2ecc71">${user.credits ?? 0}</span>`;
    }

    priceInput.addEventListener("input", () => {

      // Allow empty input while typing
      if (priceInput.value === "") {
        return;
      }

      let val = Number(priceInput.value);

      // Reject invalid values
      if (isNaN(val)) {
        priceInput.value = "";
        return;
      }

      // Remove decimals
      val = Math.floor(val);

      // Prevent negatives only
      if (val < 0) {
        val = 0;
      }

      priceInput.value = val;

    });

    quantityInput.addEventListener("input", () => {

      // Allow empty input while typing
      if (quantityInput.value === "") {
        return;
      }

      let val = Number(quantityInput.value);

      // Reject invalid values
      if (isNaN(val)) {
        quantityInput.value = "";
        return;
      }

      // Remove decimals
      val = Math.floor(val);

      // Prevent negatives only
      if (val < 0) {
        val = 0;
      }

      quantityInput.value = val;

    });
    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      loadCredits();
      setInterval(loadCredits, 15000);
    });
  </script>

</body>

</html>
