<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Seller Panel – Sell Credits</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        .nav-links li {
            margin: 6px 10px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(96, 96, 96, 0.432);
        }

        /* Main */
        .main {
            margin-left: 240px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        /* Content */
        .content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            max-width: 420px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        input {
            padding: 10px 14px;
            background: var(--box);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--text);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        button {
            margin-top: 10px;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .status {
            font-size: 0.9rem;
            margin-top: 6px;
        }

        /* Overlay (mobile) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .main {
                margin-left: 0;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-btn {
                display: block;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>Seller Panel</h2>
        <ul class="nav-links">
            <li><a href="seller.html">Browse Services</a></li>
            <li><a href="sellerOrder.html">Orders</a></li>
            <li><a href="sellCredits.html">Sell Credits</a></li>
            <li><a class="active" href="addService.html">Add Services</a></li>
            <li><a href="removeService.html">Remove Services</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <span>Sell Credits</span>
        </div>

        <div class="content">
            <h1>My Services</h1>
            <button id="addServiceBtn">+ Add New Service</button>

            <div class="services" id="serviceList"></div>
        </div>
    </main>
    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <h2>Add New Service</h2>
            <input type="text" id="serviceName" placeholder="Service Name" required />
            <textarea id="serviceDesc" placeholder="Description" rows="3" required></textarea>
            <input type="number" id="servicePrice" placeholder="Price ($)" required />
            <small style="display:block; margin-bottom:10px; color:#6b7280;">Upload an image (jpg, png, etc.)</small>

            <div style="text-align: right;">
                <button class="save-btn" id="saveService">Save</button>
                <button class="cancel-btn" id="cancelService">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const addBtn = document.getElementById("addServiceBtn");
        const modal = document.getElementById("serviceModal");
        const cancelBtn = document.getElementById("cancelService");
        const saveBtn = document.getElementById("saveService");
        const serviceList = document.getElementById("serviceList");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        addBtn.addEventListener("click", () => {
            modal.classList.add("active");
        });

        cancelBtn.addEventListener("click", () => {
            modal.classList.remove("active");
        });

        saveBtn.addEventListener("click", async () => {
            const name = document.getElementById("serviceName").value.trim();
            const desc = document.getElementById("serviceDesc").value.trim();
            const price = document.getElementById("servicePrice").value.trim();

            if (!name || !desc || !price) {
                alert("Please fill all fields and upload an image.");
                return;
            }

            const username = "john_doe";

            const payload = {
                service_title: name,
                service_description: desc,
                service_price: Number(price),
                service_sellerId: username
            };

            try {
                const res = await fetch("https://gtaw-project.vercel.app/services", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                console.log("✅ Service created:", data);
                alert("Service added: " + data.title);
            } catch (err) {
                console.error("❌ Error adding service:", err);
                alert("Failed to add service.");
            }


            const reader = new FileReader();
            reader.onload = function (e) {
                const newCard = document.createElement("div");
                newCard.classList.add("service-card");
                newCard.innerHTML = `
          <img src="${e.target.result}" alt="${name}">
          <h3>${name}</h3>
          <p>${desc}</p>
          <div class="service-meta">
            <span class="price">$${price}</span>
            <button class="delete-btn" title="Delete">🗑️</button>
          </div>
        `;

                // delete handler
                newCard.querySelector(".delete-btn").addEventListener("click", () => {
                    if (confirm("Are you sure you want to delete this service?")) {
                        newCard.remove();
                    }
                });

                serviceList.appendChild(newCard);
            }
            // reset fields
            document.getElementById("serviceName").value = "";
            document.getElementById("serviceDesc").value = "";
            document.getElementById("servicePrice").value = "";

            modal.classList.remove("active");
        });

    </script>

</body>

</html>
