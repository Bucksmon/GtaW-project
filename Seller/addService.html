<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Seller Panel</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #151e33;
      --box: #1e2945;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --danger: #ff4f4f;

      --radius: 16px;
      --radius-sm: 12px;
      --transition: .25s ease;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, .06);
      padding: 30px 0;
      transition: transform var(--transition);
      z-index: 1000;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 8px 18px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, .08);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* MAIN */

    .main {
      margin-left: 250px;
      padding: 60px 40px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text);
      cursor: pointer;
    }

    /* TABS */

    .tabs {
      display: flex;
      justify-content: center;
      /* centers tabs horizontally */
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 18px;
      min-width: 140px;
      /* gives consistent size */
      background: var(--box);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .tab.active {
      background: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ✅ ADD FIX */

    .add-wrapper {
      display: flex;
      justify-content: center;
    }

    .form-card {
      background: var(--card);
      padding: 32px;
      border-radius: var(--radius);
      max-width: 520px;
      /* reduced from 650px */
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .form-group input,
    .form-group textarea {
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, .08);
      background: var(--box);
      color: var(--text);
    }

    textarea {
      min-height: 30px;
      /* was 120px */
      resize: vertical;
    }

    .submit-btn {
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;

      display: block;
      margin-left: auto;
      margin-right: auto;
      /* centers button */
      min-width: 180px;
      /* makes it feel consistent */
    }

    /* SERVICES */

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
    }

    .service-card {
      background: var(--card);
      padding: 22px;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .service-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }

    .service-meta {
      display: flex;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, .06);
    }

    .danger-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    #pagination {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #pagination button {
      padding: 8px 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--box);
      color: var(--text);
      cursor: pointer;
    }

    #pagination button:disabled {
      opacity: .5;
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .loader-overlay.show {
      display: flex;
    }

    .popup {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, .2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width:768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 30px 20px;
      }

      .menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <h2>Royal Road</h2>
    <ul class="nav-links" id="navLinks"></ul>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div id="loaderOverlay" class="loader-overlay">
    <div class="popup">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <main class="main">

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:15px;">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="add">Add Service</button>
      <button class="tab" data-tab="remove">Remove Services</button>
    </div>

    <!-- ADD -->
    <div id="add" class="tab-content active">
      <div class="add-wrapper">
        <div class="form-card">
          <div class="form-group">
            <label>Service Title</label>
            <input id="title">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="description"></textarea>
          </div>
          <div class="form-group">
            <label>Address:(Not changeable)</label>
            <p style="margin:0; color: var(--muted);">
              Little Seoul import store, Palomino Avenue, Little Seoul
            </p>
          </div>
          <div class="form-group">
            <label>Price</label>
            <input type="number" id="price">
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input id="imageInput" placeholder="https://i.imgur.com/bua2dNG.png">
            <small style="color: var(--muted); font-size: 0.75rem;">
              Example: https://i.imgur.com/bua2dNG.png
            </small>
            <img id="preview" style="display:none;width:100%;margin-top:10px;border-radius:10px;">
          </div>
          <button class="submit-btn">Add Service</button>
        </div>
      </div>
    </div>

    <!-- REMOVE -->
    <div id="remove" class="tab-content">
      <div id="servicesContainer" class="services"></div>
      <div id="pagination"></div>
    </div>

  </main>

  <script type="module">
    import { renderSidebar } from "../methods/sidebar.js";

    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) location.href = "../index.html";

    const loaderOverlay = document.getElementById("loaderOverlay");

    function showLoader() { loaderOverlay.classList.add("show"); }
    function hideLoader() { loaderOverlay.classList.remove("show"); }

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    const tabs = document.querySelectorAll(".tab");

    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        document.getElementById(tab.dataset.tab).classList.add("active");

        if (tab.dataset.tab === "remove") loadServices();
      };
    });

    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const priceInput = document.getElementById("price");
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    imageInput.oninput = () => {
      const url = imageInput.value.trim();
      preview.style.display = url ? "block" : "none";
      preview.src = url;
    };

    document.querySelector(".submit-btn").onclick = async () => {
      const service_title = titleInput.value.trim();
      const service_description = descriptionInput.value.trim();
      const service_price = Number(priceInput.value);
      const service_image = imageInput.value.trim();

      if (!service_title || !service_description || !service_price) {
        alert("Fill required fields");
        return;
      }

      showLoader();

      try {
        const res = await fetch(`${API_BASE}/services`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            service_title,
            service_description,
            service_price,
            service_image
          })
        });

        const data = await res.json();

        if (!res.ok) return alert(data.error || "Failed");

        titleInput.value = "";
        descriptionInput.value = "";
        priceInput.value = "";
        imageInput.value = "";
        preview.style.display = "none";

      } catch (err) {
        console.error(err);
      }

      hideLoader();
    };

    let currentPage = 1;

    async function loadServices(page = 1) {
      showLoader();

      const res = await fetch(`${API_BASE}/services/mine?page=${page}&limit=8`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const data = await res.json();

      renderServices(data.services || []);
      renderPagination(data.page || 1, data.totalPages || 1);

      hideLoader();
    }

    function renderServices(services) {
      const container = document.getElementById("servicesContainer");
      container.innerHTML = "";

      if (!services.length) {
        container.innerHTML = "<p>No services found.</p>";
        return;
      }

      services.forEach(service => {
        const card = document.createElement("div");
        card.className = "service-card";

        card.innerHTML = `
<img class="service-image" src="${service.service_image || 'https://i.imgur.com/placeholder.png'}">
<h3>${service.service_title}</h3>
<p>${service.service_description}</p>
<div class="service-meta">
  Credits: 
  <span style="color: #2ecc71">${service.service_price || 0}</span>
</div>
`;

        const del = document.createElement("button");
        del.className = "danger-btn";
        del.textContent = "Delete";
        del.onclick = () => deleteService(service._id);

        card.appendChild(del);
        container.appendChild(card);
      });
    }

    async function deleteService(id) {
      if (!confirm("Delete service?")) return;

      showLoader();

      await fetch(`${API_BASE}/services/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });

      loadServices(currentPage);
      hideLoader();
    }

    function renderPagination(current, total) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";

      for (let i = 1; i <= total; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;

        if (i === current) btn.disabled = true;

        btn.onclick = () => {
          currentPage = i;
          loadServices(i);
        };

        pagination.appendChild(btn);
      }
    }

    async function loadCredits() {
      const res = await fetch(`${API_BASE}/users/me`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const user = await res.json();

      document.getElementById("creditsDisplay").innerHTML =
        `<span style="color:#2ecc71">${user.credits ?? 0}</span>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      loadCredits();
      setInterval(loadCredits, 15000);
    });
  </script>

</body>

</html>
