<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<title>Seller Panel - Add Service</title>

<style>
:root {
  --bg:#0b0f1a;
  --panel:#111827;
  --card:#121a2a;
  --box:#1a2440;
  --text:#e6e9f2;
  --muted:#9aa4b8;
  --accent:#4f8cff;
  --danger:#ff4f4f;
}

*{
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  margin:0;
  background:radial-gradient(circle at top,#111827,#0b0f1a 60%,#070a10);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* Sidebar */
.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:240px;
  height:100%;
  background:var(--panel);
  border-right:1px solid rgba(255,255,255,0.08);
  padding-top:25px;
  box-shadow:4px 0 20px rgba(0,0,0,0.5);
}

.sidebar h2{
  text-align:center;
  margin-bottom:25px;
}

.nav-links{
  list-style:none;
  padding:0;
}

.nav-links li{
  margin:6px 15px;
}

.nav-links a{
  display:block;
  padding:12px 16px;
  color:white;
  text-decoration:none;
  border-radius:10px;
  transition:.2s;
}

.nav-links a:hover,
.nav-links a.active{
  background:rgba(96,96,96,0.4);
}

/* Main */
.main{
  margin-left:240px;
  padding:30px;
}

/* Card Form */
.form-card{
  background:var(--card);
  padding:25px;
  border-radius:16px;
  max-width:600px;
}

.form-group{
  margin-bottom:20px;
  display:flex;
  flex-direction:column;
}

.form-group label{
  margin-bottom:8px;
  font-weight:600;
}

.form-group input,
.form-group textarea{
  padding:10px 14px;
  background:var(--box);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  color:var(--text);
}

.form-group textarea{
  resize:none;
  height:100px;
}

/* Modern Image Upload */
.image-upload{
  border:2px dashed rgba(255,255,255,0.15);
  border-radius:14px;
  padding:25px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  background:var(--box);
  position:relative;
}

.image-upload:hover{
  border-color:var(--accent);
}

.image-upload i{
  font-size:2rem;
  display:block;
  margin-bottom:10px;
}

.image-preview{
  margin-top:15px;
  max-height:180px;
  object-fit:cover;
  border-radius:10px;
  display:none;
  width:100%;
}

.helper-text{
  font-size:0.8rem;
  color:var(--muted);
  margin-top:6px;
}

/* Button */
.submit-btn{
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.submit-btn:hover{
  opacity:.9;
}

/* Loader */
.loader{
  margin-top:15px;
  display:none;
}

.spinner{
  width:20px;
  height:20px;
  border:3px solid rgba(255,255,255,0.25);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

/* Responsive */
@media(max-width:768px){
  .main{
    margin-left:0;
    padding:20px;
  }
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }
}
</style>
</head>

<body>

<aside class="sidebar">
  <h2>Seller Panel</h2>
  <ul class="nav-links">
    <li><a href="seller.html">Browse Services</a></li>
    <li><a href="sellerOrder.html">Orders</a></li>
    <li><a href="sellCredits.html">Sell Credits</a></li>
    <li><a class="active" href="#">Add Service</a></li>
  </ul>
</aside>

<main class="main">
  <div class="form-card">
    <h2>Add New Service</h2>

    <div class="form-group">
      <label>Service Title</label>
      <input type="text" id="title">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="description"></textarea>
    </div>

    <div class="form-group">
      <label>Price (credits)</label>
      <input type="number" id="price">
    </div>

    <div class="form-group">
      <label>Service Image (Imgur Link)</label>
      <div class="image-upload" onclick="document.getElementById('imageInput').focus()">
        <i>🖼️</i>
        Click to paste image URL
        <input type="text" id="imageInput" style="opacity:0; position:absolute; inset:0; cursor:pointer;">
      </div>
      <div class="helper-text">
        Example: https://i.imgur.com/placeholder.png
      </div>
      <img id="preview" class="image-preview">
    </div>

    <button class="submit-btn" onclick="submitService()">Add Service</button>

    <div class="loader" id="loader">
      <div class="spinner"></div>
    </div>
  </div>
</main>

<script>
const preview=document.getElementById("preview");
const imageInput=document.getElementById("imageInput");
const loader=document.getElementById("loader");

imageInput.addEventListener("input",()=>{
  if(imageInput.value){
    preview.src=imageInput.value;
    preview.style.display="block";
  }
});

async function submitService(){
  loader.style.display="block";

  setTimeout(()=>{
    loader.style.display="none";
    alert("Service Added (Demo)");
  },1000);
}
</script>

</body>
</html>
