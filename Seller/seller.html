<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Seller Panel - Add Service</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --card: #121a2a;
      --box: #1a2440;
      --text: #e6e9f2;
      --muted: #9aa4b8;
      --accent: #4f8cff;
      --danger: #ff4f4f;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 25px;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
      transition: transform .3s ease;
      z-index: 1000;
    }

    .nav-links {
      list-style: none;
      padding: 0;
    }

    .nav-links li {
      margin: 6px 15px;
    }

    .nav-links a {
      display: block;
      padding: 12px 16px;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: .2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(96, 96, 96, 0.4);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .menu-btn {
      font-size: 1.6rem;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: none;
    }

    /* ================= FORM ================= */

    .form-card {
      background: var(--card);
      padding: 25px;
      border-radius: 16px;
      max-width: 600px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      padding: 10px 14px;
      background: var(--box);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text);
    }

    .form-group textarea {
      resize: none;
      height: 100px;
    }

    .helper-text {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Preview */
    .image-preview {
      margin-top: 15px;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      display: none;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Button */
    .submit-btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .submit-btn:hover {
      opacity: .9;
    }

    /* Loader */
    .loader {
      margin-top: 15px;
      display: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <h2 style="text-align:center;">Seller Panel</h2>
    <ul class="nav-links">
      <li><a class="active" href="seller.html">Browse Services</a></li>
      <li><a href="sellerOrder.html">Orders</a></li>
      <li><a href="sellCredits.html">Sell Credits</a></li>
      <li><a href="addService.html">Add Services</a></li>
      <li><a href="removeService.html">Remove Services</a></li>
      <li><a href="../index.html">Logout</a></li>
    </ul>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">

    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2>Add Service</h2>
    </div>

    <div class="form-card">

      <div class="form-group">
        <label>Service Title</label>
        <input type="text" id="title">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description"></textarea>
      </div>

      <div class="form-group">
        <label>Price (credits)</label>
        <input type="number" id="price">
      </div>

      <div class="form-group">
        <label>Service Image (Imgur Link)</label>
        <input type="text" id="imageInput" placeholder="https://i.imgur.com/example.png">
        <div class="helper-text">
          Example: https://i.imgur.com/placeholder.png
        </div>
        <img id="preview" class="image-preview">
      </div>

      <button class="submit-btn" onclick="submitService()">Add Service</button>

      <div class="loader" id="loader">
        <div class="spinner"></div>
      </div>

    </div>
  </main>

  <script>
    const API_BASE = "https://gtaw-project.vercel.app";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "../index.html";
    }

    /* ================= Sidebar ================= */
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    });

    /* ================= Form ================= */

    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const priceInput = document.getElementById("price");
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const loader = document.getElementById("loader");

    /* Live Image Preview */
    imageInput.addEventListener("input", () => {
      const url = imageInput.value.trim();

      if (url !== "") {
        preview.src = url;
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }
    });

    /* ================= Submit ================= */

    async function submitService() {
      const service_title = titleInput.value.trim();
      const service_description = descriptionInput.value.trim();
      const service_price = Number(priceInput.value);
      const service_image = imageInput.value.trim();

      if (!service_title || !service_description || !service_price) {
        alert("Please fill all required fields.");
        return;
      }

      loader.style.display = "block";

      try {
        const res = await fetch(`${API_BASE}/services`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            service_title,
            service_description,
            service_price,
            service_image
          })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Failed to add service");
          loader.style.display = "none";
          return;
        }

        alert("Service added successfully!");

        /* Clear form */
        titleInput.value = "";
        descriptionInput.value = "";
        priceInput.value = "";
        imageInput.value = "";
        preview.style.display = "none";

      } catch (err) {
        console.error("Add service error:", err);
        alert("Server error");
      } finally {
        loader.style.display = "none";
      }
    }
  </script>

</body>

</html>
