<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Seller Panel</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #151e33;
            --box: #1e2945;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --danger: #ff4f4f;

            --radius: 16px;
            --radius-sm: 12px;
            --transition: .25s ease;
        }

        /* Base */
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            width: 250px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, .06);
            padding: 30px 0;
            transition: transform var(--transition);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 8px 18px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, .08);
        }

        /* Main */
        .main {
            margin-left: 250px;
            padding: 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.6rem;
            cursor: pointer;
        }

        /* Grid */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        /* Card */
        .service-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .35);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-6px);
        }

        .service-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--box);
        }

        .service-card h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .service-card p {
            margin: 0;
            font-size: .9rem;
            color: var(--muted);
        }

        .service-card strong {
            color: var(--text);
        }

        .service-card button {
            margin-top: auto;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .service-card button:hover {
            opacity: .9;
        }

        /* Responsive */
        @media(max-width:768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .menu-btn {
                display: block;
            }
        }

        .service-card button {
            background: #ff4f4f;
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <h2>Seller Panel</h2>
        <ul class="nav-links">
            <li><a href="seller.html">Browse Services</a></li>
            <li><a href="sellerOrder.html">Orders</a></li>
            <li><a href="sellCredits.html">Sell Credits</a></li>
            <li><a href="addService.html">Add Services</a></li>
            <li><a class="active" href="removeService.html">Remove Services</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>
    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="global-loader">
        <div class="loader-box">
            <div class="spinner-large"></div>
            <p>Loading...</p>
        </div>
    </div>
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
        </div>

        <div id="servicesContainer" class="services"></div>
        <div id="pagination"></div>

    </main>

    <script>
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "../index.html";
        }
        const globalLoader = document.getElementById("globalLoader");

        let activeRequests = 0;

        function showLoader() {
            activeRequests++;
            globalLoader.style.display = "flex";
        }

        function hideLoader() {
            activeRequests--;
            if (activeRequests <= 0) {
                activeRequests = 0;
                globalLoader.style.display = "none";
            }
        }
        /* ===== Decode JWT (UI only, not security) ===== */
        function parseJWT(token) {
            try {
                return JSON.parse(atob(token.split('.')[1]));
            } catch {
                return null;
            }
        }

        const user = parseJWT(token);

        /* ===== Sidebar Toggle ===== */
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        /* Active nav highlight */
        const currentPagePath = window.location.pathname.split("/").pop();
        document.querySelectorAll(".nav-links a").forEach(link => {
            if (link.getAttribute("href") === currentPagePath) {
                link.classList.add("active");
            }
        });

        let currentPage = 1;

        /* ================= LOAD SERVICES ================= */

        async function loadServices(page = 1) {
            showLoader();

            try {
                const res = await fetch(
                    `${API_BASE}/services/mine?page=${page}&limit=8`,
                    {
                        headers: { Authorization: `Bearer ${token}` },
                        cache: "no-store"
                    }
                );

                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || "Failed to load services");
                    return;
                }

                renderServices(data.services || []);
                renderPagination(data.page || 1, data.totalPages || 1);

            } catch (err) {
                console.error(err);
            } finally {
                hideLoader();
            }
        }

        /* ================= RENDER ================= */

        function renderServices(services) {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            if (!services.length) {
                container.innerHTML = "<p>No services found.</p>";
                return;
            }

            services.forEach(service => {
                const card = document.createElement("div");
                card.className = "service-card";

                const isAdmin = user?.role === "admin";
                const isSellerOwner = user?.role === "seller" && service.service_sellerId?._id === user.id;
                const isBuyer = user?.role === "buyer";

                card.innerHTML = `
      <img class="service-image" 
           src="${service.service_image || 'https://i.imgur.com/placeholder.png'}" 
           alt="Service Image">
      <h3>${service.service_title || "No title"}</h3>
      <p>${service.service_description || "No description"}</p>
      <p><strong>Price:</strong> ${service.service_price || 0} credits</p>
      <p><strong>Seller:</strong> ${service.service_sellerId?.username || "Unknown"}</p>
    `;

                /* BUY BUTTON (Buyer Only) */
                if (isBuyer) {
                    const buyBtn = document.createElement("button");
                    buyBtn.textContent = "Buy";
                    buyBtn.onclick = () => buyService(service._id);
                    card.appendChild(buyBtn);
                }

                /* DELETE BUTTON (Admin OR Seller Owner) */
                if (isAdmin || isSellerOwner) {
                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "✖";
                    deleteBtn.style.background = "var(--danger)";
                    deleteBtn.style.marginTop = "8px";
                    deleteBtn.onclick = () => deleteService(service._id);
                    card.appendChild(deleteBtn);
                }

                container.appendChild(card);
            });
        }

        /* ================= DELETE ================= */

        async function deleteService(serviceId) {
            if (!confirm("Delete this service?")) return;

            showLoader();

            try {
                const res = await fetch(`${API_BASE}/services/${serviceId}`, {
                    method: "DELETE",
                    headers: { Authorization: `Bearer ${token}` }
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || "Delete failed");
                    return;
                }

                await loadServices(currentPage);

            } catch (err) {
                console.error(err);
            } finally {
                hideLoader();
            }
        }

        /* ================= PAGINATION ================= */

        function renderPagination(current, total) {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";

            for (let i = 1; i <= total; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                if (i === current) btn.disabled = true;
                btn.onclick = () => {
                    currentPage = i;
                    loadServices(i);
                };
                pagination.appendChild(btn);
            }
        }

        /* ================= BUY ================= */

        async function buyService(serviceId) {
            try {
                const res = await fetch(`${API_BASE}/orders/buy-service`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ serviceId })
                });

                const data = await res.json();
                if (!res.ok) return alert(data.error || "Purchase failed");

                alert("Service purchased!");
                document.getElementById("creditsDisplay").textContent = data.buyerCredits;

            } catch (err) {
                console.error(err);
            }
        }

        /* ================= INIT ================= */
        async function loadCredits(show = false) {
            if (show) showLoader();

            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();
                document.getElementById("creditsDisplay").textContent =
                    user.credits ?? 0;

            } catch (err) {
                console.log("Failed to load credits", err);
            } finally {
                if (show) hideLoader();
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            loadServices(currentPage);
            loadCredits(true);
            setInterval(() => loadCredits(false), 15000);
        });
    </script>

</body>

</html>
