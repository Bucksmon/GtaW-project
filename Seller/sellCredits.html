<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Seller Panel – Sell Credits</title>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #151e33;
            --box: #1e2945;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --danger: #ff4f4f;
            --success: #2ecc71;

            --radius: 16px;
            --radius-sm: 12px;
            --transition: .25s ease;
        }

        /* ================= BASE ================= */

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid rgba(255, 255, 255, .06);
            padding: 30px 0;
            transition: transform var(--transition);
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 8px 18px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255, 255, 255, .08);
        }

        /* ================= OVERLAY ================= */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 250px;
            padding: 60px 40px;
            min-height: 100vh;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .topbar h2 {
            margin: 0;
            font-weight: 600;
        }

        .topbar span {
            color: var(--accent);
            font-weight: 600;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text);
            cursor: pointer;
        }

        /* ================= CONTENT ================= */

        .content {
            max-width: 520px;
        }

        /* ================= CARD ================= */

        .card {
            background: var(--card);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 20px 55px rgba(0, 0, 0, .4);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* ================= FORM ================= */

        form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        label {
            font-size: .9rem;
            color: var(--muted);
        }

        input {
            padding: 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, .08);
            background: var(--box);
            color: var(--text);
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 140, 255, .3);
        }

        /* ================= BUTTON ================= */

        button {
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        button:hover {
            opacity: .9;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ================= STATUS ================= */

        .status {
            font-size: .9rem;
            margin-top: 5px;
            min-height: 20px;
            transition: var(--transition);
        }

        /* ================= GLOBAL LOADER ================= */

        .global-loader {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .loader-box {
            background: var(--card);
            padding: 40px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .spinner-large {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, .2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            margin: auto;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width:768px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 30px 20px;
            }

            .menu-btn {
                display: block;
            }

            .content {
                max-width: 100%;
            }

        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>Seller Panel</h2>
        <ul class="nav-links">
            <li><a href="seller.html">Browse Services</a></li>
            <li><a href="sellerOrder.html">Orders</a></li>
            <li><a class="active" href="sellCredits.html">Sell Credits</a></li>
            <li><a href="addService.html">Add Services</a></li>
            <li><a href="removeService.html">Remove Services</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>
    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="global-loader">
        <div class="loader-box">
            <div class="spinner-large"></div>
            <p>Processing request...</p>
        </div>
    </div>
    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
        </div>

        <div class="content">
            <div class="card">
                <h2>Sell Credits</h2>

                <form id="creditForm">
                    <label>Routing Number</label>
                    <input id="routingNumber" placeholder="Numbers only" />

                    <label>Discord Tag</label>
                    <input id="discordTag" placeholder="angel_nunez4" />

                    <label>Credit Amount</label>
                    <input id="credits" type="number" min="1" placeholder="100" />

                    <button type="submit">Submit</button>
                    <div id="status" class="status"></div>
                </form>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "../index.html";
        }

        async function loadCredits(showLoader = false) {
            if (showLoader) showGlobalLoader();

            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: {
                        Authorization: "Bearer " + token
                    }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();
                document.getElementById("creditsDisplay").textContent =
                    user.credits ?? 0;

            } catch (err) {
                console.log("Failed to load credits", err);
            } finally {
                if (showLoader) hideGlobalLoader();
            }
        }
        const globalLoader = document.getElementById("globalLoader");

        function showGlobalLoader() {
            globalLoader.style.display = "flex";
        }

        function hideGlobalLoader() {
            globalLoader.style.display = "none";
        }
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        const form = document.getElementById("creditForm");
        const routingInput = document.getElementById("routingNumber");
        const discordInput = document.getElementById("discordTag");
        const creditsInput = document.getElementById("credits");
        const status = document.getElementById("status");
        const submitBtn = document.querySelector("#creditForm button");

        // Disable initially
        submitBtn.disabled = true;

        function validateFormRealtime() {
            const routing = routingInput.value.trim();
            const discord = discordInput.value.trim();
            const credits = creditsInput.value.trim();

            status.style.color = "red";
            submitBtn.disabled = true;

            // ===== Routing Number =====
            if (!routing) {
                status.textContent = "Routing number required.";
                return;
            }

            if (!/^\d+$/.test(routing)) {
                status.textContent = "Routing number must be numeric.";
                return;
            }

            if (routing.length !== 9) {
                status.textContent = "Routing number must be 9 digits.";
                return;
            }

            // ===== Discord Tag =====
            if (!discord) {
                status.textContent = "Discord tag required.";
                return;
            }

            if (discord.includes(" ")) {
                status.textContent = "Discord tag cannot contain spaces.";
                return;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(discord)) {
                status.textContent = "Discord tag format invalid.";
                return;
            }

            // ===== Credits =====
            if (!credits) {
                status.textContent = "Credit amount required.";
                return;
            }

            const creditAmount = Number(credits);

            if (isNaN(creditAmount) || creditAmount <= 0) {
                status.textContent = "Enter a valid credit amount.";
                return;
            }

            // ✅ All checks passed
            status.style.color = "limegreen";
            status.textContent = "All fields valid ✓";
            submitBtn.disabled = false;
        }

        // Real-time listeners
        routingInput.addEventListener("input", validateFormRealtime);
        discordInput.addEventListener("input", validateFormRealtime);
        creditsInput.addEventListener("input", validateFormRealtime);

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (submitBtn.disabled) return;

            const routingNumber = routingInput.value.trim();
            const discordTag = discordInput.value.trim();
            const creditAmount = Number(creditsInput.value.trim());

            submitBtn.disabled = true;
            showGlobalLoader();

            try {
                const res = await fetch(
                    `${API_BASE}/discord/credits-request`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify({
                            type: "sell",
                            routing_number: routingNumber,
                            amount_credits: creditAmount,
                            discord_tag: discordTag
                        })
                    }
                );

                if (!res.ok) throw new Error("Server error " + res.status);

                const data = await res.json();

                status.style.color = "limegreen";
                status.textContent = "Request submitted successfully ✓";

                form.reset();
                submitBtn.disabled = true;

                // Optional: refresh credits immediately
                await loadCredits();

            } catch (err) {
                status.style.color = "red";
                status.textContent = "API error: " + err.message;
            } finally {
                hideGlobalLoader();
                submitBtn.disabled = false;
            }
        });
        document.addEventListener("DOMContentLoaded", () => {
            loadCredits(true);
        });

    </script>

</body>

</html>
