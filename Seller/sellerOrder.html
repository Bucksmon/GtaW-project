<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Seller Orders</title>

    <style>
        /* EXACT SAME CSS AS ABOVE */
        :root {
            --bg: #0b0f1a;
            --panel: #111827;
            --card: #121a2a;
            --box: #1a2440;
            --text: #e6e9f2;
            --muted: #9aa4b8;
            --accent: #4f8cff;
            --danger: #ff4f4f;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #111827, #0b0f1a 60%, #070a10);
            color: var(--text);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100%;
            background: var(--panel);
            padding-top: 25px;
            transition: transform .3s ease;
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 6px 15px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(96, 96, 96, 0.4);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

        .main {
            margin-left: 240px;
            padding: 20px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .menu-btn {
            font-size: 1.6rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: none;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .service-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--box);
        }

        @media(max-width:768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .menu-btn {
                display: block;
            }
        }

        /* ================= GLOBAL LOADER ================= */

        .global-loader {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .loader-box {
            background: var(--card);
            padding: 35px 45px;
            border-radius: 16px;
            text-align: center;
        }

        .spinner-large {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            margin: auto;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <h2>Seller Panel</h2>
        <ul class="nav-links">
            <li><a href="seller.html">Browse Services</a></li>
            <li><a class="active" href="#">Orders</a></li>
            <li><a href="sellCredits.html">Sell Credits</a></li>
            <li><a href="addService.html">Add Services</a></li>
            <li><a href="removeService.html">Remove Services</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>
    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="global-loader">
        <div class="loader-box">
            <div class="spinner-large"></div>
            <p>Loading...</p>
        </div>
    </div>
    <main class="main">

        <div class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h2>Your Credits: <span id="creditsDisplay">0</span></h2>
        </div>

        <div id="servicesContainer" class="services"></div>
    </main>

    <script>
        const API_BASE = "https://gtaw-project.vercel.app";
        const token = localStorage.getItem("token");

        if (!token) { window.location.href = "../index.html"; }
        const globalLoader = document.getElementById("globalLoader");

        let activeRequests = 0;

        function showLoader() {
            activeRequests++;
            globalLoader.style.display = "flex";
        }

        function hideLoader() {
            activeRequests--;
            if (activeRequests <= 0) {
                activeRequests = 0;
                globalLoader.style.display = "none";
            }
        }
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        });

        async function loadSellerOrders() {
            showLoader();

            try {
                const res = await fetch(`${API_BASE}/orders/seller`, {
                    headers: { Authorization: `Bearer ${token}` }
                });

                if (!res.ok) throw new Error();

                const data = await res.json();
                renderOrders(data);

            } catch (err) {
                console.error("Failed to load seller orders:", err);
            } finally {
                hideLoader();
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "";

            if (!orders.length) {
                container.innerHTML = "<p>No orders yet.</p>";
                return;
            }

            orders.forEach(order => {
                const card = document.createElement("div");
                card.className = "service-card";

                card.innerHTML = `
      <img class="service-image"
        src="${order.service?.service_image || 'https://i.imgur.com/placeholder.png'}">
      <h3>${order.service?.service_title}</h3>
      <p><strong>Buyer:</strong> ${order.buyer?.username}</p>
      <p><strong>Total Price:</strong> ${order.totalPrice} credits</p>
      <p><strong>You Received:</strong> ${order.sellerAmount} credits</p>
      <p><strong>Status:</strong> ${order.status}</p>
    `;

                container.appendChild(card);
            });
        }

        async function loadCredits(show = false) {
            if (show) showLoader();

            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) throw new Error();

                const user = await res.json();
                document.getElementById("creditsDisplay").textContent =
                    user.credits ?? 0;

            } catch (err) {
                console.log("Failed to load credits", err);
            } finally {
                if (show) hideLoader();
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            loadSellerOrders();
            loadCredits(true);   // show loader first time
            setInterval(() => loadCredits(false), 15000);
        });
    </script>

</body>

</html>
